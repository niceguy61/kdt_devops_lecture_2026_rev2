services:
  app:
    build: ./app/python
    ports: ["8080:8080"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - LOKI_URL=http://loki:3100
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage"]
    depends_on:
      - app
      - node-exporter
      - cadvisor
      - docker-exporter

  grafana:
    image: grafana/grafana:10.4.0
    ports: ["3000:3000"]
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=exemplars
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/loadtest.yml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/loadtest.json:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:2.9.0
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: grafana/tempo:2.4.0
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro
    ports: ["9100:9100"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports: ["8081:8080"]

  docker-exporter:
    build: ./docker-exporter
    ports: ["8082:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  k6:
    image: grafana/k6:latest
    volumes: ["./k6:/scripts:ro"]
    command: ["run", "/scripts/smoke.js"]
    profiles: ["load"]
