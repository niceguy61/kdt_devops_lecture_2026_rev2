server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ 로 시작하는 요청은 catalog-api 컨테이너로 넘긴다 (리버스 프록시)
    location /api/ {
        proxy_pass http://catalog-api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
