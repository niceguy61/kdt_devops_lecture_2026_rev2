# 5교시 · 컨테이너는 root가 아닌 사용자로 — Audit로 현재 상태부터 본다
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [devmart] }
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  matchConditions:
    - name: not-istio-managed
      expression: "!has(object.metadata.labels) || !('gateway.istio.io/managed' in object.metadata.labels)"
  validations:
    - expression: >-
        (has(object.spec.template.spec.securityContext) &&
         has(object.spec.template.spec.securityContext.runAsNonRoot) &&
         object.spec.template.spec.securityContext.runAsNonRoot == true) ||
        object.spec.template.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)
      message: "runAsNonRoot: true를 지정해야 합니다."
