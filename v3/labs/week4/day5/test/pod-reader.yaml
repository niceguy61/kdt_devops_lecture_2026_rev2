# 3교시 · Pod 목록만 읽을 수 있는 ServiceAccount (API를 부르는 프로그램의 신원)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: devmart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: devmart
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: devmart
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: devmart
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
