# DevMart MSA CI + 매니페스트 갱신 — 4주차 3일차 (3주차 2일차에 job 하나를 더했다)
# 저장소 최상위의 .github/workflows/ 에 두어야 GitHub가 읽는다.
name: devmart-ci

on:
  pull_request:                       # PR을 열거나 새 커밋을 올릴 때
    paths:
      - "devmart-msa/**"
      - ".github/workflows/devmart-ci.yml"
  push:
    branches: [main]                  # main에 합쳐졌을 때
    paths:
      - "devmart-msa/**"
      - ".github/workflows/devmart-ci.yml"

permissions:
  contents: read                      # 기본은 읽기만 (최소 권한)

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, order-api]
    defaults:
      run:
        working-directory: devmart-msa/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: devmart-msa/${{ matrix.service }}/requirements*.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 단위 테스트
        run: python -m pytest -v

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: compose.yaml 문법 검사
        working-directory: devmart-msa
        env:
          DB_PASSWORD: ci-dummy-not-secret
        run: docker compose config --quiet

  build:
    name: build (${{ matrix.service }})
    needs: [test, compose-check]      # 앞의 두 작업이 성공해야 시작
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # GHCR에 이미지를 올릴 권한
    strategy:
      matrix:
        service: [catalog-api, order-api, order-worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인 (main에 push될 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/devmart-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 빌드 (main이면 push까지)
        uses: docker/build-push-action@v7
        with:
          context: devmart-msa/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifest:
    name: 배포 저장소에 새 태그 적기
    needs: build                      # 세 이미지가 모두 올라간 뒤
    if: github.event_name == 'push'   # main일 때만
    runs-on: ubuntu-latest
    steps:
      # 코드 저장소가 아니라 '배포 저장소'(devmart-deploy)를 받는다
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/devmart-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}   # 그 저장소 하나만 쓸 수 있는 토큰 (7교시)
      - name: kustomize로 이미지 태그 바꾸기
        working-directory: devmart
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}          # 이미지 주소는 소문자
          TAG=sha-${GITHUB_SHA::7}                     # metadata-action의 type=sha와 같은 모양
          for s in catalog-api order-api order-worker; do
            kustomize edit set image ghcr.io/$OWNER/devmart-$s=ghcr.io/$OWNER/devmart-$s:$TAG
          done
          git diff
      - name: 커밋하고 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devmart/kustomization.yaml
          git commit -m "deploy: devmart 이미지 → sha-${GITHUB_SHA::7}" \
                     -m "코드 커밋: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            || { echo "바뀐 것 없음"; exit 0; }
          git push
