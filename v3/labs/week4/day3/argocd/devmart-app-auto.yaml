# 6교시 · 자동 동기화 + 스스로 고치기 + 지운 것 정리
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devmart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ID/devmart-deploy.git
    targetRevision: main
    path: devmart
  destination:
    server: https://kubernetes.default.svc
    namespace: devmart
  syncPolicy:
    automated:
      prune: true        # Git에서 지운 리소스는 클러스터에서도 지운다
      selfHeal: true     # 누가 손으로 바꾸면 Git대로 되돌린다
