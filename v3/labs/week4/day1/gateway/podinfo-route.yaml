# 다른 네임스페이스(default)의 앱도 같은 문을 쓴다 — 이번엔 Host로 나눈다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: default
spec:
  parentRefs:
    - name: devmart
      namespace: devmart        # 다른 네임스페이스의 Gateway
  hostnames:
    - podinfo.localhost
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
