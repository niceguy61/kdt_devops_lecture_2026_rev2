# default 네임스페이스의 허락 — "devmart의 HTTPRoute가 우리 Service를 가리켜도 된다"
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-devmart-routes
  namespace: default               # 허락하는 쪽(Service가 있는 곳)에 만든다
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: devmart
  to:
    - group: ""                    # core 그룹 (Service)
      kind: Service
