# 7교시 장애 4 · devmart의 라우트가 default의 Service를 가리킨다 — 허락 없이
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-mirror
  namespace: devmart
spec:
  parentRefs:
    - name: devmart
  hostnames:
    - mirror.localhost
  rules:
    - backendRefs:
        - name: podinfo
          namespace: default       # 다른 네임스페이스
          port: 9898
