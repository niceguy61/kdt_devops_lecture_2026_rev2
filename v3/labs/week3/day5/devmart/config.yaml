# 비밀이 아닌 설정 — Compose의 environment: 중 비밀번호를 뺀 나머지
apiVersion: v1
kind: ConfigMap
metadata:
  name: devmart-config
  namespace: devmart
data:
  APP_ENV: "kind"
  DB_HOST: "db"
  DB_USER: "devmart"
  REDIS_HOST: "redis"
  QUEUE_NAME: "orders"
  CATALOG_URL: "http://catalog-api:8000"
  CATALOG_TIMEOUT: "2"
