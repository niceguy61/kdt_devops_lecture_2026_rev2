# PostgreSQL — 디스크(PVC) 하나를 붙인 DB 한 대
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: devmart
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: devmart
  labels: { app: db }
spec:
  replicas: 1
  strategy:
    type: Recreate          # 디스크는 한 Pod만 쓸 수 있다 — 옛것을 내린 뒤 새것을 띄운다
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: catalog
            - name: POSTGRES_USER
              value: devmart
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devmart-db, key: DB_PASSWORD }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devmart", "-d", "catalog"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: db-data }
        - name: init
          configMap: { name: db-init }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: devmart
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
