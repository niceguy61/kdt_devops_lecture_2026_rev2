<!doctype html><html><head><meta charset="utf-8"><style>/* 다이어그램 공통 스타일 — 1600x900 캔버스 기준 */
:root{
  --navy:#0F2A44; --navy2:#1E3A5F; --teal:#0089A0; --teal-d:#006A7C; --teal-l:#E0F3F6;
  --orange:#C8651B; --orange-l:#FBEBDD; --slate:#475569; --slate-l:#EEF2F6; --line:#D5DEE6;
  --red:#B83227; --red-l:#FBE7E5; --green:#2E7D4F; --green-l:#E3F3E9; --violet:#5B4BB7; --violet-l:#ECEAFB;
  --aws-region:#00A4A6; --aws-az:#147EBA; --ink:#1E293B; --muted:#64748B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:"Pretendard",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
.canvas{width:1600px;height:900px;padding:40px 40px;display:flex;flex-direction:column;justify-content:center;gap:28px;overflow:hidden;background:#fff}
.hd{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-0.5px}
.sub{font-size:24px;color:var(--muted);font-weight:500;margin-top:-16px}
.row{display:flex;align-items:stretch;gap:24px}
.row.c{align-items:center}
.col{display:flex;flex-direction:column;gap:18px}
.grow{flex:1 1 0;min-width:0}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:26px 28px;display:flex;flex-direction:column;gap:12px}
.card.fill-teal{background:var(--teal-l);border-color:#9fd6df}
.card.fill-orange{background:var(--orange-l);border-color:#efc6a3}
.card.fill-slate{background:var(--slate-l);border-color:var(--line)}
.card.fill-red{background:var(--red-l);border-color:#efb7b1}
.card.fill-green{background:var(--green-l);border-color:#a9d6bb}
.card.fill-violet{background:var(--violet-l);border-color:#c6c0ef}
.card.fill-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card h3{font-size:30px;font-weight:800;color:var(--navy);line-height:1.25}
.card.fill-navy h3{color:#fff}
.card p,.card li{font-size:23px;line-height:1.45;color:var(--slate)}
.card.fill-navy p{color:#cfe3ee}
.card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card li::before{content:"• ";color:var(--teal);font-weight:800}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ic svg{display:block}
.chip{display:inline-block;font-size:20px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--slate-l);color:var(--slate)}
.chip.teal{background:var(--teal);color:#fff}.chip.orange{background:var(--orange);color:#fff}.chip.navy{background:var(--navy);color:#fff}
.arr{flex:none;display:flex;align-items:center;justify-content:center;color:#9AAAB8}
.center{text-align:center;align-items:center}
.muted{color:var(--muted)}
.note{font-size:21px;color:var(--muted)}
.big{font-size:54px;font-weight:900}
.t-teal{color:var(--teal)}.t-orange{color:var(--orange)}.t-red{color:var(--red)}.t-green{color:var(--green)}.t-navy{color:var(--navy)}
.tag{font-size:18px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.grid{display:grid;gap:22px}
.box{border-radius:16px;padding:14px 18px;font-size:22px;font-weight:700;text-align:center}
.dash{border:3px dashed var(--line);border-radius:22px;padding:22px}
.hd,.sub{display:none}
.flow{align-items:stretch}
.arr{align-self:center}

    .canvas{width:1320px;height:1100px}</style></head><body><div class="canvas"><div class="row" style="gap:16px"><div class="tag" style="width:250px;text-align:center">TCP/IP 4계층 (실제 구현)</div>
<div class="tag" style="width:260px;text-align:center">OSI 7계층 (참조 모델)</div><div class="tag grow" style="text-align:center">주소</div><div class="tag grow" style="text-align:center">대표 기술</div></div>
<div class="col" style="gap:12px"><div class="row" style="gap:16px">
 <div class="box" style="width:250px;background:var(--teal);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">응용</div>
 <div class="col" style="width:260px;gap:6px;justify-content:center"><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">7 응용</div><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">6 표현</div><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">5 세션</div></div>
 <div class="box grow" style="background:var(--teal-l);color:var(--navy);font-size:23px;display:flex;align-items:center;justify-content:center">도메인 · URL</div>
 <div class="box grow" style="background:var(--slate-l);color:var(--slate);font-size:22px;display:flex;align-items:center;justify-content:center">HTTP · DNS · SSH</div></div><div class="row" style="gap:16px">
 <div class="box" style="width:250px;background:var(--orange);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">전송</div>
 <div class="col" style="width:260px;gap:6px;justify-content:center"><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">4 전송</div></div>
 <div class="box grow" style="background:var(--orange-l);color:var(--navy);font-size:23px;display:flex;align-items:center;justify-content:center">포트</div>
 <div class="box grow" style="background:var(--slate-l);color:var(--slate);font-size:22px;display:flex;align-items:center;justify-content:center">TCP · UDP</div></div><div class="row" style="gap:16px">
 <div class="box" style="width:250px;background:var(--violet);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">인터넷</div>
 <div class="col" style="width:260px;gap:6px;justify-content:center"><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">3 네트워크</div></div>
 <div class="box grow" style="background:var(--violet-l);color:var(--navy);font-size:23px;display:flex;align-items:center;justify-content:center">IP 주소</div>
 <div class="box grow" style="background:var(--slate-l);color:var(--slate);font-size:22px;display:flex;align-items:center;justify-content:center">IP · ICMP</div></div><div class="row" style="gap:16px">
 <div class="box" style="width:250px;background:var(--slate);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center">네트워크 접근</div>
 <div class="col" style="width:260px;gap:6px;justify-content:center"><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">2 데이터링크</div><div class="box" style="background:#fff;border:2px solid var(--line);color:var(--slate);font-size:20px;padding:8px">1 물리</div></div>
 <div class="box grow" style="background:var(--slate-l);color:var(--navy);font-size:23px;display:flex;align-items:center;justify-content:center">MAC 주소</div>
 <div class="box grow" style="background:var(--slate-l);color:var(--slate);font-size:22px;display:flex;align-items:center;justify-content:center">이더넷 · 와이파이</div></div></div>
<div class="row" style="gap:16px"><div class="card fill-orange grow" style="padding:16px 22px"><p style="font-size:21px"><b style="color:var(--navy)">L4</b> = IP·포트까지 보고 판단 (AWS NLB)</p></div>
<div class="card fill-teal grow" style="padding:16px 22px"><p style="font-size:21px"><b style="color:var(--navy)">L7</b> = HTTP 내용(경로·헤더)까지 보고 판단 (AWS ALB)</p></div></div></div></body></html>
