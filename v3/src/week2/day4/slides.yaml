meta:
  footer: "2주차 4일차 · 볼륨 · 네트워크 · 환경 변수"
  title: "2주차 4일차 — 볼륨 · 네트워크 · 환경 변수"

slides:
  - type: cover
    kicker: "CLOUD NATIVE DEVOPS · 2주차 핸즈온"
    title: "볼륨 · 네트워크 · 환경 변수"
    subtitle: "2주차 4일차 · 데이터는 어디에 · 서로를 어떻게 찾나 · 비밀번호는 어떻게 건네나 — 웹 · API · DB 세 컨테이너 조립"
    notes: "오늘 목표는 API 응답의 source를 sample에서 database로 바꾸는 것. 세 가지 문제(데이터, 주소, 비밀번호)를 차례로 푼다."

  - type: agenda
    title: "오늘의 흐름"
    items:
      - ["1교시", "1", "컨테이너의 데이터는 어디에"]
      - ["2교시", "2", "이름 있는 볼륨"]
      - ["3교시", "3", "바인드 마운트"]
      - ["4교시", "4", "Docker 네트워크와 이름 찾기"]
      - ["5교시", "5", "API와 DB 연결하기"]
      - ["6교시", "6", "환경 변수와 비밀값"]
      - ["7교시", "7", "세 컨테이너 손으로 조립하기 + 배움일기"]
    notes: "postgres:18 이미지를 1교시 전에 미리 pull 하게 한다. 실습 폴더는 반드시 WSL 쪽 ~/devops-lab."

  # 1교시
  - type: section
    num: "1교시"
    title: "컨테이너의 데이터는 어디에"
    goals: ["어제 이미지 손 복습", "PostgreSQL 첫 실행", "지우면 사라지는 데이터", "이름 없는 볼륨의 정체"]
    notes: "어제 1교시 그림 — 컨테이너의 얇은 쓰기 가능한 층을 다시 떠올린다."

  - type: image
    title: "호텔 방과 개인 금고"
    img: week2/day4/w2d4-ephemeral.png
    notes: "기억할 것이 없는 앱(API, 웹)에는 '지우면 사라짐'이 장점, DB에는 치명적."

  - type: code
    title: "실습 1 · 볼륨 없이 DB를 지워 보기"
    code: |
      docker run -d --name db-temp -e POSTGRES_USER=devmart \
        -e POSTGRES_PASSWORD=devmart-pw -e POSTGRES_DB=devmart postgres:18
      docker exec db-temp pg_isready -U devmart
      docker exec db-temp psql -U devmart -d devmart \
        -c "CREATE TABLE memo(t TEXT); INSERT INTO memo VALUES ('지워질까?');"
      docker rm -f db-temp      # 같은 명령으로 다시 run 후
      docker exec db-temp psql -U devmart -d devmart -c "SELECT * FROM memo;"
      docker volume ls
    out: |
      ERROR:  relation "memo" does not exist
      local     1673955…(64자리 무작위 이름)
      local     5835936…(64자리 무작위 이름)
    points:
      - ["사라졌다", "새 컨테이너 = 새 빈 데이터"]
      - ["이름 없는 볼륨", "이미지의 VOLUME 지시어 때문에 자동 생성"]
      - ["고아", "남지만 찾을 수 없다 · docker rm -v, volume prune"]
    notes: "비밀번호를 명령에 쓰는 나쁜 습관은 6교시에 고친다고 미리 말해 둔다. 학술: ACID의 D(지속성) — Härder & Reuter 1983. 트렌드: 운영 DB는 관리형(RDS)이 많다."

  # 2교시
  - type: section
    num: "2교시"
    title: "이름 있는 볼륨"
    goals: ["docker volume create", "초기화 SQL로 상품 5개", "지워도 남는 데이터", "PG18 경로 함정 · 백업"]
    notes: "-v도 -p처럼 바깥:안 순서."

  - type: code
    title: "실습 2~3 · DB를 볼륨 위에 세우기"
    code: |
      docker volume create devmart-db
      docker run -d --name db \
        -e POSTGRES_USER=devmart -e POSTGRES_PASSWORD=devmart-pw -e POSTGRES_DB=devmart \
        -v devmart-db:/var/lib/postgresql \
        -v "$PWD/db/init":/docker-entrypoint-initdb.d:ro \
        postgres:18
      docker exec db psql -U devmart -d devmart -c "SELECT * FROM products;"
      docker rm -f db      # 같은 볼륨으로 다시 run
      docker exec db psql -U devmart -d devmart -c "SELECT name FROM products;"
    out: |
      (5 rows)  러닝화 · 후드 집업 · 에코백 · 텀블러 · 무선 이어폰
      (6 rows)  … 볼륨 테스트 양말 까지 그대로
    points:
      - ["initdb.d", "빈 DB일 때 한 번만 실행 — 시드 데이터"]
      - ["같은 이름", "새 컨테이너에 붙이면 데이터 그대로"]
      - ["이름 db", "4교시부터 API가 이 이름으로 찾는다"]
    notes: "초기화 SQL을 고쳤는데 반영 안 됨 → 볼륨에 데이터가 이미 있기 때문."

  - type: compare
    title: "PostgreSQL 18 — 인터넷 예제를 조심"
    left: ["17 이하 (옛 예제 · AI 답변)", ["-v 볼륨:/var/lib/postgresql/data", "PGDATA = …/data", "18 이미지에 쓰면 경고 후 시작 멈춤"]]
    right: ["18 (오늘)", ["-v 볼륨:/var/lib/postgresql", "PGDATA = /var/lib/postgresql/18/docker", "주 버전 업그레이드(pg_upgrade)를 쉽게", "막히면 공식 이미지 문서부터"]]
    notes: "docker exec db sh -c 'echo $PGDATA'로 확인. 예제가 언제, 어떤 버전으로 쓰였는지 보는 습관."

  - type: code
    title: "실습 4 · 볼륨 백업 파일 만들기"
    code: |
      docker volume inspect devmart-db --format '{{.Mountpoint}}'
      docker run --rm \
        -v devmart-db:/data:ro \
        -v ~/devops-lab/backup:/backup \
        alpine:3.24 tar czf /backup/devmart-db.tgz -C /data .
      ls -lh ~/devops-lab/backup
    out: |
      /var/lib/docker/volumes/devmart-db/_data
      -rw-r--r-- 1 root root 11M … devmart-db.tgz
    points:
      - ["임시 컨테이너", "볼륨과 내 폴더를 함께 붙여 tar"]
      - ["연습용", "실제 DB 백업은 pg_dump · 스냅샷"]
      - ["volume rm", "휴지통 없음 — 백업부터 확인"]
    notes: "Docker Desktop에서는 Mountpoint가 숨은 VM 안이라 탐색기에서 안 보인다. 학술: WAL / ARIES (Mohan et al. 1992) — 실행 중 파일 복사가 위험한 이유. 트렌드: 볼륨 드라이버 → K8s CSI → EBS."

  # 3교시
  - type: section
    num: "3교시"
    title: "바인드 마운트"
    goals: ["내 폴더를 그대로", "DevMart 웹 화면 3파일", "고치면 즉시 반영", ":ro 읽기 전용"]
    notes: "비유: 금고 vs 창문."

  - type: image
    title: "세 가지 마운트 — 어디에 저장되고 누가 관리하나"
    img: week2/day4/w2d4-mount-types.png
    notes: "Docker는 -v 왼쪽이 경로처럼 생겼는지로 볼륨/바인드를 구분한다."

  - type: code
    title: "실습 5 · nginx에 폴더째 보여 주기"
    code: |
      cd ~/devops-lab/devmart
      code web/index.html web/style.css web/app.js     # 3파일 붙여 넣기
      docker run -d --name web -p 8080:80 \
        -v "$PWD/web":/usr/share/nginx/html:ro nginx:1.30-alpine
      # index.html 제목 수정 → 브라우저 F5
      docker exec web sh -c 'echo hacked > /usr/share/nginx/html/index.html'
    out: |
      sh: can't create /usr/share/nginx/html/index.html: Read-only file system
    points:
      - ["빨간 글씨", "API 미연결 — 지금은 정상, 7교시에 해결"]
      - ["F5만", "빌드·재시작 없이 즉시 반영"]
      - [":ro", "컨테이너가 뚫려도 내 파일은 안전"]
    notes: "Windows: /mnt/c 아래 폴더는 느리고 변경 감지가 안 될 수 있다. 학술: 마운트 네임스페이스 (Biederman 2006). 트렌드: docker compose watch."

  - type: compare
    title: "DB도 바인드 마운트로? — 정석은 나누기"
    left: ["바인드 마운트에 DB를 두면", ["컨테이너 UID로 만든 파일 → 권한 꼬임", "Docker Desktop에서 작은 쓰기가 느림", "실수로 지우기 쉽다"]]
    right: ["정석", ["DB 데이터 → 이름 있는 볼륨", "코드 · 설정 → 바인드 마운트 (:ro)", "임시 파일 → tmpfs", "Windows는 프로젝트를 WSL 안에"]]
    notes: "정리: docker rm -f web, git add devmart/web devmart/db, commit, push."

  # 4교시
  - type: section
    num: "4교시"
    title: "Docker 네트워크와 이름 찾기"
    goals: ["IP는 믿을 수 없다", "기본 bridge는 이름을 모른다", "devmart-net 만들기", "-p와 네트워크의 차이"]
    notes: "DB_HOST에 localhost? IP? 이름? — 질문으로 시작."

  - type: image
    title: "기본 bridge vs 직접 만든 네트워크"
    img: week2/day4/w2d4-bridge-dns.png
    notes: "비유: 자리 번호 vs 사내 전화번호부. 기본 bridge는 호환성 때문에 내장 DNS가 꺼져 있다."

  - type: code
    title: "실습 6~7 · 이름 찾기 비교"
    code: |
      docker run -d --name api-a devmart/catalog-api:1.0.1
      docker run -d --name api-b devmart/catalog-api:1.0.1
      docker exec api-a getent hosts api-b; echo "결과 코드: $?"
      docker network create devmart-net
      docker network connect devmart-net db
      docker run --rm --network devmart-net devmart/catalog-api:1.0.1 getent hosts db
    out: |
      결과 코드: 2
      172.18.0.2      db
    points:
      - ["기본 bridge", "IP로는 통해도 이름은 모른다"]
      - ["IP는 바뀐다", "다시 띄우면 다른 번호"]
      - ["devmart-net", "컨테이너 이름 = 주소"]
    notes: "단계 4에서 api-c를 끼워 넣어 api-b의 IP가 바뀌는 것을 보여 준다. 정리: docker rm -f api-a api-b api-c."

  - type: table
    title: "-p와 네트워크는 다른 문"
    head: ["", "-p 8000:8000", "--network devmart-net"]
    rows:
      - ["누가", "노트북 바깥 → 컨테이너", "컨테이너 ↔ 컨테이너"]
      - ["주소", "localhost:8000", "db:5432 (이름:컨테이너 포트)"]
      - ["포트", "바깥:안 — 바깥은 바꿀 수 있다", "컨테이너가 듣는 포트 그대로"]
      - ["DB는?", "주지 않는다 (최소 노출)", "같은 네트워크만 접속"]
    colw: [2.2, 4.8, 5.1]
    callout: "학술: DNS (Mockapetris, RFC 1034·1035, 1987) — 이름과 주소를 나눈다 · K8s CoreDNS, Istio로 이어진다"
    notes: "컨테이너마다 네트워크 네임스페이스가 따로라 localhost가 각자 자신. 트렌드: IP가 아니라 신원(identity)으로 연결 — 서비스 메시."

  # 5교시
  - type: section
    num: "5교시"
    title: "API와 DB 연결하기"
    goals: ["DB_HOST=db", "source: database", "고장 세 가지", "로그로 층 좁히기"]
    notes: "코드는 그대로, 환경 변수만 바꿔 동작을 바꾼다."

  - type: image
    title: "같은 네트워크 안에서 이름으로 DB 찾기"
    img: week2/day4/w2d4-api-db.png
    notes: "API는 확인용으로 8000을 열었지만 7교시에는 닫는다."

  - type: code
    title: "실습 8 · API를 DB에 연결"
    code: |
      docker run -d --name catalog-api --network devmart-net -p 8000:8000 \
        -e APP_ENV=docker -e DB_HOST=db -e DB_PASSWORD=devmart-pw \
        devmart/catalog-api:1.0.1
      curl http://localhost:8000/api/products
      docker exec db psql -U devmart -d devmart \
        -c "UPDATE products SET price=9900 WHERE name='에코백';"
    out: |
      {"items":[{"id":1,"name":"러닝화",…},{"id":5,"name":"무선 이어폰","price":89000}],"source":"database"}
    points:
      - ["5개", "텀블러 · 이어폰은 DB에만 있다"]
      - ["가격 = 데이터", "다시 빌드하지 않고 DB만 고친다"]
    notes: "어제는 가격 하나에 1.0.1을 빌드했다. 코드와 데이터를 나누는 설계."

  - type: table
    title: "실습 9 · 증상은 같고 원인은 다르다 — 503 database unavailable"
    head: ["고장", "만드는 법", "docker logs catalog-api"]
    rows:
      - ["1 DB가 꺼짐", "docker stop db", "failed to resolve host 'db'"]
      - ["2 비밀번호 틀림", "-e DB_PASSWORD=wrong-password", "password authentication failed"]
      - ["3 다른 네트워크", "--network 빼먹기", "failed to resolve host 'db'"]
    colw: [2.8, 4.0, 5.3]
    mono_col: 2
    callout: "DB를 다시 켜면 API는 스스로 회복 — 재시작 필요 없음 · 1과 3은 메시지가 같으니 둘 다 확인"
    notes: "curl -w '(HTTP %{http_code})'로 503을 보여 준다."

  - type: image
    title: "연결 고장 진단 순서 — 바깥에서 안으로"
    img: week2/day4/w2d4-debug-order.png
    notes: "학술: 분산 컴퓨팅의 8가지 오류(Deutsch 1994) — '네트워크는 믿을 수 있다'. 잘 만든 서비스: 죽지 않고 503, 로그에 원인, 스스로 회복. 트렌드: 헬스 체크, readiness probe."

  # 6교시
  - type: section
    num: "6교시"
    title: "환경 변수와 비밀값"
    goals: ["비밀번호는 어디에 남았나", ".env와 --env-file", "우선순위", "환경 변수의 한계"]
    notes: "12-Factor III 설정 — 1주차 4일차 6교시."

  - type: image
    title: "이미지는 하나, 설정은 바깥에서"
    img: week2/day4/w2d4-config.png
    notes: "12-Factor 시험: 지금 저장소를 공개해도 비밀값이 새지 않는가? 우리 저장소는 이미 public."

  - type: code
    title: "실습 10~11 · 찾고, .env로 옮기기"
    code: |
      history | grep devmart-pw
      docker inspect catalog-api --format '{{range .Config.Env}}{{println .}}{{end}}'
      cp .env.example .env && code .env            # DB_PASSWORD=devmart-pw
      git check-ignore -v devmart/.env
      docker run -d --name catalog-api --network devmart-net -p 8000:8000 \
        --env-file .env -e APP_ENV=docker -e DB_HOST=db devmart/catalog-api:1.0.1
      history -c && history -w
    out: |
      devmart/.gitignore:1:.env	devmart/.env
    points:
      - [".env.example", "이름만 — Git에 올린다"]
      - [".env", "진짜 값 — .gitignore"]
      - ["PG 비밀번호", "볼륨이 빌 때 한 번만 정해진다"]
    notes: "급할 때는 명령 앞에 빈칸(HISTCONTROL=ignoreboth). 비밀번호 확인은 길이만: ${#DB_PASSWORD}."

  - type: table
    title: "우선순위와 비밀값의 단계"
    head: ["단계", "방법", "막는 것"]
    rows:
      - ["0", "코드 · Dockerfile에 직접", "아무것도"]
      - ["1", "명령어 -e", "이미지 · Git"]
      - ["2 (오늘)", ".env + --env-file", "+ 셸 기록"]
      - ["3", "파일 비밀값 /run/secrets", "+ docker inspect · env 노출"]
      - ["4", "비밀 저장소 + 짧게 사는 자격 증명", "+ 오래된 비밀번호, 접근 기록"]
    colw: [1.8, 5.2, 5.1]
    callout: "우선순위: -e > --env-file > Dockerfile ENV — 나중에, 더 구체적으로 준 값이 이긴다"
    notes: "학술: Meli et al. NDSS 2019 — 10만 개 넘는 저장소에서 비밀값, 매일 수천 개 새로 유출. 한 번 새면 회수 불가 → 폐기·재발급. 트렌드: GitHub 푸시 보호, OIDC, IAM 역할."

  # 7교시
  - type: section
    num: "7교시"
    title: "세 컨테이너 손으로 조립하기"
    goals: ["nginx 리버스 프록시", "db → api → web", "순서가 틀리면", "스크립트와 그 한계"]
    notes: "리버스 프록시 = 홀 직원."

  - type: image
    title: "DevMart 3계층 — 바깥 문은 8080 하나"
    img: week2/day4/w2d4-three-tier.png
    notes: "설정 파일을 web/ 안에 두면 누구나 내려받는다 → nginx/ 폴더."

  - type: code
    title: "실습 13 · 손으로 조립"
    code: |
      set -a; source .env; set +a
      docker run -d --name db --network devmart-net \
        -e POSTGRES_USER=devmart -e POSTGRES_DB=devmart -e POSTGRES_PASSWORD="$DB_PASSWORD" \
        -v devmart-db:/var/lib/postgresql -v "$PWD/db/init":/docker-entrypoint-initdb.d:ro postgres:18
      docker run -d --name catalog-api --network devmart-net \
        --env-file .env -e APP_ENV=docker -e DB_HOST=db devmart/catalog-api:1.0.1
      docker run -d --name web --network devmart-net -p 8080:80 \
        -v "$PWD/web":/usr/share/nginx/html:ro \
        -v "$PWD/nginx/default.conf":/etc/nginx/conf.d/default.conf:ro nginx:1.30-alpine
    out: |
      web           Up 3 seconds    0.0.0.0:8080->80/tcp
      catalog-api   Up 10 seconds   8000/tcp
      db            Up 25 seconds   5432/tcp
    points:
