      - ["3교시", "3", "Git 설치와 설정"]
      - ["4교시", "4", "GitHub 계정과 인증 (gh)"]
      - ["5교시", "5", "첫 저장소 — commit과 push"]
      - ["6교시", "6", "Docker Desktop 설치"]
      - ["7교시", "7", "설치 점검과 문제 해결 + 배움일기"]
