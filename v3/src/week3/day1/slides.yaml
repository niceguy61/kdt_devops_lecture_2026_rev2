      - ["5교시", "요청 ID로 네 서비스 로그를 시간 순으로"]
      - ["6교시", "동기는 기다리고, 비동기는 맡긴다 · 처리기 3개"]
      - ["7교시", "주소 · DB 이름 · 큐 이름 — 조용한 장애"]
