    subtitle: "1주차 4일차 · 구성요소 지도 · 프론트엔드와 백엔드 · 확장성과 가용성 · DB · 캐시와 큐 · 폭주 트래픽 · 모놀리식과 MSA"
    notes: "숨은 제목: 내가 가고 싶은 회사의 서비스는 코드 하나로 돌아가지 않는다. 회사 사례는 회사 소개가 아니라 '무엇이 늘면 어떤 부담이 함께 느는가'로 읽는다."

  - type: agenda
    title: "오늘의 흐름"
    items:
      - ["1교시", "1", "현대 앱의 지도 — 커머스"]
      - ["2교시", "2", "프론트엔드와 백엔드 — 금융 · 지역 서비스"]
      - ["3교시", "3", "확장성과 가용성"]
      - ["4교시", "4", "데이터베이스와 저장소 — 검색"]
      - ["5교시", "5", "캐시와 메시지 큐 — 메시징 · 배달"]
      - ["6교시", "6", "폭주 트래픽과 AI 플랫폼"]
      - ["7교시", "7", "모놀리식과 MSA, 왜 Docker인가"]
      - ["8교시", "8", "API와 인증"]
    notes: "배움일기는 수업 뒤 각자 쓴다(마지막 정리 슬라이드의 질문)."

  # 1교시
  - type: section
    num: "1교시"
    title: "현대 앱의 지도"
    goals: ["어제 10분 요약", "상품 페이지 분해", "구성요소 10가지와 3-tier", "비즈니스 성장과 시스템 부담"]
    notes: "어제 요청의 여정 ⑥~⑧(앱·캐시·DB)을 확대한다."

  - type: table
    title: "어제 10분 요약"
    head: ["어제 배운 것", "한 문장"]
    rows:
      - ["계층과 패킷", "데이터는 패킷으로, 층마다 포장(캡슐화)"]
      - ["IP와 서브넷", "사설 IP + NAT, 0.0.0.0/0 = 인터넷 전체"]
      - ["포트", "refused는 받을 프로그램 없음, timed out은 방화벽"]
      - ["DNS와 HTTP", "이름 → IP, 4xx는 요청 쪽, 5xx는 서버 쪽"]
      - ["요청의 여정", "DNS → TCP → TLS → CDN → LB → 앱 → 캐시 → DB"]
    colw: [3.4, 8.7]
    callout: "오늘은 마지막 세 칸 — 앱, 캐시, DB — 를 확대한다"
    notes: "학생에게 먼저 말해 보게 하기."

  - type: image
    title: "상품 페이지 하나를 분해하면"
    img: week1/day4/w1d4-product-page.png
    notes: "쿠팡 엔지니어링 블로그: 하나의 구조에서 여러 서비스로 나눠 간 여정, 데이터 플랫폼의 글로벌 확장. 패턴: 상품·판매자·사용자·지역이 늘면 데이터 소유권, 읽기 속도, 피크, 배포 조율 부담이 함께 는다."

  - type: image
    title: "현대 애플리케이션의 구성요소 10가지"
    img: week1/day4/w1d4-component-map.png
    notes: "코드는 1~2번, 3~10번은 실행 조건. 이 과정 전체가 '실행 조건을 정확하고 반복 가능하게 맞추는 법'."

  - type: image
    title: "3-tier — 가장 기본이 되는 모양"
    img: week1/day4/w1d4-three-tier.png
    notes: "층을 나누면 따로 바꾸고 따로 늘린다. 3교시 스케일 아웃의 출발점."

  - type: compare
    title: "학술 노트 — 모듈화의 기준 (Parnas, 1972)"
    left: ["처리 순서대로 나누면", ["입력 → 계산 → 출력 순으로 쪼갠다", "한 결정이 바뀌면 여러 모듈을 고친다", "변경이 번진다"]]
    right: ["정보 은닉으로 나누면", ["바뀔 결정을 하나씩 숨긴다", "다른 모듈은 '알려 줘'라고만 묻는다", "→ 3-tier, API, 마이크로서비스의 뿌리"]]
    notes: "Parnas, D. L. (1972). On the criteria to be used in decomposing systems into modules. CACM 15(12)."

  - type: table
    title: "비즈니스가 커지면 시스템 부담도 커진다"
    head: ["늘어나는 것", "함께 늘어나는 시스템 부담"]
    rows:
      - ["상품 수", "카탈로그 저장, 이미지 저장, 검색 색인"]
      - ["사용자 수", "API 처리량, 캐시 적중률, 모니터링"]
      - ["주문 수", "재고 정확성, 큐 처리, 재시도"]
      - ["서비스 지역", "네트워크 지연, 트래픽 분배"]
      - ["개발자 수", "배포 조율, 코드 충돌, 환경 차이"]
    colw: [3.0, 9.1]
    callout: "사람이 늘어나는 것도 시스템 부담 — '제 컴퓨터에선 되는데요'"
    callout_color: orange
    notes: "마지막 줄이 5일차 협업과 2주차 Docker로 이어진다."

  - type: table
    title: "트렌드 — AI가 '구성요소 하나'로 들어온다"
    head: ["구성요소", "AI가 붙는 방식", "새로 생기는 운영 조건"]
    rows:
      - ["백엔드", "LLM API 호출", "모델 엔드포인트, 토큰 비용, 호출 제한"]
      - ["데이터", "검색 증강 생성(RAG)", "문서 조각내기, 임베딩, 벡터 DB"]
      - ["컴퓨트", "모델 학습 · 추론", "GPU, 대용량 메모리, 스케줄링"]
      - ["관찰", "AI 응답 품질 감시", "비용 · 지연 · 정확도 지표"]
    colw: [2.2, 3.9, 6.0]
    callout: "AI는 마법이 아니라 지도 위의 새 실행 조건 — DORA 2025 '증폭기'"
    notes: "구성요소 지도를 이해하는 팀은 AI를 잘 붙이고, 아니면 AI가 복잡도만 키운다."

  - type: quiz
    title: "1교시 확인 문제"
    questions:
      - "추천 상품 영역 뒤의 시스템이 특히 많이 쓰는 자원은?"
      - "3-tier의 세 계층 이름은?"
      - "애플리케이션 = 코드 + ○○ ○○"
      - "파나스가 제안한 모듈 분해 기준은?"
    answers: "1) GPU · 데이터 파이프라인  2) 표현 · 애플리케이션 · 데이터  3) 실행 조건  4) 정보 은닉"

  # 2교시
  - type: section
    num: "2교시"
    title: "프론트엔드와 백엔드"
    goals: ["화면 뒤의 공장", "백엔드가 하는 일과 API", "stateless 서버", "서비스 경계 질문 다섯"]
    notes: "사례: 토스(마이크로 프론트엔드, 모노레포), 당근(당근페이 백엔드)."

  - type: table
    title: "프론트엔드 — 화면 뒤의 공장"
    head: ["구성요소", "역할", "고장 나면"]
    rows:
      - ["UI 컴포넌트", "버튼 · 카드 재사용", "화면마다 모양이 다름"]
      - ["라우터", "주소별 화면 결정", "엉뚱한 화면, 빈 화면"]
      - ["빌드 도구", "소스 → 브라우저 파일", "빌드 실패"]
      - ["패키지 관리자", "외부 라이브러리 설치", "버전 충돌"]
      - ["환경 설정", "API 주소, 기능 켜고 끄기", "엉뚱한 백엔드에 연결"]
    colw: [2.8, 4.4, 4.9]
    callout: "토스 — 마이크로 프론트엔드 · 모노레포 빌드 최적화: 화면이 늘면 빌드 · 버전 · 미리보기 부담이 는다"
    notes: "Toss Tech 원문은 교재 참고 문헌. 같은 코드도 Node·패키지 버전, 설정이 다르면 다르게 동작."

  - type: image
    title: "API — 서로 약속한 주문서"
    img: week1/day4/w1d4-api-contract.png
    notes: "백엔드: 받고 → 검사하고 → 데이터 다루고 → 다른 시스템 부르고 → 답한다."

  - type: compare
    title: "상태 없는(stateless) 서버"
    left: ["stateful", ["로그인 정보를 서버 A 메모리에", "다음 요청도 반드시 서버 A로", "A가 죽으면 그 사용자는 로그아웃", "늘리기 어렵다"]]
    right: ["stateless", ["상태는 토큰 · Redis · DB로", "다음 요청이 아무 서버로 가도 OK", "한 대가 죽어도 다른 서버가 이어받음", "자유롭게 늘리고 줄인다"]]
    notes: "서버를 애완동물(pets)이 아닌 가축(cattle)처럼. K8s가 Pod를 마음대로 죽이고 다시 띄울 수 있는 전제."

  - type: table
    title: "서비스 경계 — 어디서 나눌까"
    head: ["질문", "왜 중요한가"]
    rows:
      - ["이 데이터는 누가 소유하는가?", "아무나 중요한 데이터를 고치지 못하게"]
      - ["누가 이 API를 호출할 수 있는가?", "권한과 신뢰 경계"]
      - ["실패하면 무엇이 함께 멈추는가?", "장애 영향 범위(blast radius)"]
      - ["혼자 배포할 수 있는가?", "다른 팀을 기다리지 않는다"]
      - ["정상인지 어떻게 확인하는가?", "헬스 체크"]
    colw: [5.2, 6.9]
    callout: "당근페이 — 인증 · 결제 같은 공통 기능일수록 경계를 분명히: MSA가 항상 정답은 아니다"
    notes: "당근 Tech Blog '당근페이 백엔드 아키텍처가 걸어온 여정'."

  - type: statement
    icon: Users
    title: "학술 노트 — 콘웨이의 법칙 (1968)"
    text: "시스템을 설계하는 조직은\n그 조직의 의사소통 구조를 닮은 설계를 만든다"
    sub: "Conway (1968) Datamation · 역콘웨이 전략: 원하는 구조가 있으면 팀 구조를 먼저 그렇게 짠다 — 5일차 Team Topologies"
    notes: "서비스 경계는 기술 결정인 동시에 조직 결정."

  - type: cards
    title: "트렌드 — BFF와 API 우선 설계"
    cards:
      - [MonitorSmartphone, teal, "BFF", "웹 · iOS · 안드로이드별로 얇은 전용 API 층"]
      - [FileText, orange, "API 우선", "코드 전에 OpenAPI 명세부터 합의"]
      - [Bot, violet, "AI 코딩과 궁합", "명세가 분명할수록 AI가 정확한 코드를 만든다"]
    notes: "Newman (2021) Building Microservices 2nd ed."

  - type: quiz
    title: "2교시 확인 문제"
    questions:
      - "같은 프론트 코드가 사람마다 다르게 동작하는 원인 두 가지는?"
      - "API를 식당에 비유하면?"
      - "로그인 정보를 서버 메모리에 두면 늘릴 때 생기는 문제는?"
      - "'시스템은 조직 구조를 닮는다' 법칙의 이름은?"
    answers: "1) 런타임·패키지 버전 차이, 환경 설정 차이  2) 주문서 양식  3) 같은 서버로만 가야 하고 그 서버가 죽으면 로그아웃  4) 콘웨이의 법칙"

  # 3교시
  - type: section
    num: "3교시"
    title: "확장성과 가용성"
    goals: ["스케일 업 vs 스케일 아웃", "가용성 = 9의 개수", "단일 장애점(SPOF)", "CAP 정리"]
    notes: "1일차 '빠른 탄력성'이 실제로 무엇인지."

  - type: image
    title: "스케일 업 vs 스케일 아웃"
    img: week1/day4/w1d4-scale.png
    callout: "클라우드는 스케일 아웃의 시대 — K8s replicas, HPA로 이어진다"
    notes: "스케일 아웃의 조건: stateless + 로드밸런서 + 헬스 체크."

  - type: table
    title: "가용성 — '9의 개수'로 말한다"
    head: ["가용성", "별칭", "1년 허용 장애", "한 달 허용 장애"]
    rows:
      - ["99%", "투 나인", "약 3.65일", "약 7.3시간"]
      - ["99.9%", "쓰리 나인", "약 8.8시간", "약 43분"]
      - ["99.99%", "포 나인", "약 53분", "약 4.3분"]
      - ["99.999%", "파이브 나인", "약 5.3분", "약 26초"]
    colw: [2.4, 2.6, 3.5, 3.6]
    mono_col: 0
    callout: "직렬 99.9% × 3 ≈ 99.7% · 병렬 99% × 2 ≈ 99.99% — 의존은 깎고, 이중화는 높인다"
    callout_color: orange
    notes: "9 하나 = 허용 장애 1/10, 비용은 크게 증가. 서비스에 맞는 목표를 정한다."

  - type: image
    title: "단일 장애점(SPOF) 찾고 없애기"
    img: week1/day4/w1d4-spof.png
    notes: "서버 → 여러 대+LB, AZ → Multi-AZ, DB → 대기 복제본(RDS Multi-AZ), 리전 → 멀티 리전, 사람 → 문서·런북. 어제 본 2025 AWS 장애: us-east-1과 DynamoDB 엔드포인트 하나에 대한 숨은 의존."

  - type: compare
    title: "학술 노트 — CAP 정리 (Brewer 2000 · Gilbert & Lynch 2002)"
    left: ["CP — 일관성 선택", ["네트워크가 끊기면 응답 거부", "틀린 답보다 에러가 낫다", "은행 잔액, 재고 수량"]]
    right: ["AP — 가용성 선택", ["조금 오래된 답이라도 준다", "에러보다 응답이 낫다", "SNS 좋아요 수, 리뷰"]]
    notes: "C 일관성, A 가용성, P 분할 내성. 네트워크는 믿을 수 없으니 P는 포기 불가 → 끊겼을 때 C와 A 중 선택. Brewer (2012) 'CAP twelve years later': 셋 중 둘은 지나친 단순화."

  - type: statement
    icon: Gauge
    title: "트렌드 — SLO와 오류 예산"
    text: "SLO 99.9% → 한 달 약 43분이 '오류 예산'\n남으면 과감히 배포, 다 쓰면 안정화"
    sub: "100%는 불가능하고 바람직하지도 않다 — 개발(속도)과 운영(안정)의 갈등을 숫자 하나로 합의 (Google SRE, 4주차)"
    notes: "Beyer et al. (2016) Site Reliability Engineering, Ch.3–4."

  - type: quiz
    title: "3교시 확인 문제"
    questions:
      - "더 큰 서버로 바꾸기 / 여러 대로 늘리기의 이름은?"
      - "99.9%면 한 달 허용 장애는 대략?"
      - "RDS를 두 가용 영역에 나눠 두는 기능은?"
      - "네트워크 분할 시 은행 잔액은 CP? AP?"
    answers: "1) 스케일 업, 스케일 아웃  2) 약 43분  3) Multi-AZ  4) CP"

  # 4교시
  - type: section
    num: "4교시"
    title: "데이터베이스와 저장소"
    goals: ["데이터 책임 여섯 가지", "RDB · SQL · ACID", "NoSQL의 종류", "관계형 모델과 Dynamo"]
    notes: "stateless는 결국 '상태를 데이터 계층에 맡긴다'는 뜻."

  - type: table
    title: "데이터는 사라지면 안 된다 — 데이터 책임"
    head: ["책임", "뜻", "소홀하면"]
    rows:
      - ["영속성", "재시작해도 남는다", "컨테이너를 지웠더니 데이터도 사라짐"]
      - ["인덱스", "빠른 조회 경로", "데이터가 늘수록 점점 느려짐"]
      - ["백업", "잃었을 때 복구", "실수 한 번에 전부 손실"]
