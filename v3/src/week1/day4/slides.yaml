      - ["8교시", "인증 401 · 인가 403, 세션 vs 토큰, JWT는 서명만 — OAuth·OIDC는 5주차까지"]
    diary: "배움일기 — 기억에 남는 회사 사례와 '늘어난 것 · 함께 는 부담' · 내 서비스를 10가지 구성요소로 · 손으로 설치하면 가장 귀찮을 것"
    notes: "내일은 DevOps 문화와 협업. 오늘 본 '개발자 수 증가'와 콘웨이의 법칙을 사람 쪽에서 본다."
