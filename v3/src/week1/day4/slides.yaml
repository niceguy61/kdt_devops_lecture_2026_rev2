    callout: "Docker = 앱과 실행 조건을 이미지 하나로 포장해, 어디서든 똑같이 실행되게 하는 도구"
    notes: "12-Factor의 개발/운영 일치를 현실로. 그제 배운 네임스페이스와 cgroups가 바탕. 다음 주 직접 명령 입력."

