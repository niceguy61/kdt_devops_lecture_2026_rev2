      - "파울러가 MonolithFirst에서 권한 것은?"
      - "Docker를 한 문장으로?"
    answers: "1) 스케일 아웃  2) 지연, 장애 전파, 데이터 일관성  3) 모놀리식으로 시작해 경계가 분명해지면 나누기  4) 앱과 실행 조건을 이미지로 포장해 어디서든 똑같이 실행"

  # 8교시
  - type: section
    num: "8교시"
    title: "API와 인증"
    goals: ["인증(누구) vs 인가(무엇을)", "세션 vs 토큰 — 상태를 어디에", "JWT 세 부분 읽기", "OAuth 2.0 · OIDC · 멱등성"]
    notes: "2교시의 stateless와 이어진다. 로그인은 상태다 — 그 상태를 어디에 둘 것인가."

  - type: compare
    title: "인증과 인가"
    left: ["인증 AuthN — 너는 누구냐?", ["비밀번호 · MFA · 인증서 · 토큰", "실패 → 401", "건물 입구의 신분증 확인"]]
    right: ["인가 AuthZ — 해도 되나?", ["역할 · 정책 · 권한 목록", "실패 → 403", "출입증에 찍힌 층 · 방"]]
    notes: "5주차 AccessDenied는 다시 로그인할 게 아니라 정책을 고쳐야 한다."

  - type: table
    title: "로그인 상태는 어디에 — 세션과 토큰"
    head: ["", "세션", "토큰 (JWT)"]
    rows:
      - ["서버가 주는 것", "번호표(세션 ID) 쿠키", "서명된 증명서"]
      - ["상태를 기억하는 곳", "서버 저장소(Redis)", "토큰 자체"]
      - ["서버를 늘리면", "공용 저장소 필요", "서명 검사 열쇠만 있으면 됨"]
      - ["강제 로그아웃", "저장소에서 지우면 끝", "어렵다 — 만료까지 유효"]
    colw: [3.2, 4.4, 4.5]
    callout: "현업은 짧은 접근 토큰(15분) + 긴 갱신 토큰을 섞는다"

  - type: code
    title: "JWT 읽기 — 점으로 나뉜 세 부분"
    shell: "text"
    code: |
      헤더    {"alg":"RS256"}
      내용    {"sub":"user-42","role":"customer","exp":1795600000}
      서명    발급자의 열쇠로 만든 값
    points:
      - ["인코딩", "암호화가 아니다 — 누구나 읽는다"]
      - ["서명", "변조 방지만 보장"]
      - ["exp", "훔치면 만료까지 주인 행세"]
    notes: "비밀번호 · 개인정보를 넣지 않는다. 토큰은 화면 · 채팅 · 저장소에 노출 금지."

  - type: compare
    title: "남의 신원을 빌려 쓰기"
    left: ["OAuth 2.0 = 위임장", ["\"이 앱이 내 대신 저장소 목록을 읽어도 된다\"", "범위(scope)와 기한", "비밀번호는 GitHub에만"]]
    right: ["OIDC = 신분 확인서", ["OAuth 위에 ID 토큰(JWT)", "\"이 사람은 누구다\"", "5주차 Actions → AWS 역할"]]

  - type: table
    title: "이 과정에서 다시 만나는 곳"
    head: ["주차", "장면", "개념"]
    rows:
      - ["2주차", "gh auth login", "OAuth 2.0"]
      - ["3주차", "GITHUB_TOKEN으로 GHCR push", "짧은 토큰 · 범위"]
      - ["4주차", "ServiceAccount 토큰 · RBAC", "JWT 인증 + 역할 인가"]
      - ["5주차", "aws login · Actions OIDC", "오래 사는 비밀 없애기"]
    colw: [1.8, 5.6, 4.7]

  - type: table
    title: "다시 보내도 안전한가 — 멱등성"
    head: ["요청", "두 번 보내면", "멱등"]
    rows:
      - ["GET /orders/7", "두 번 읽음", "✓"]
      - ["PUT /orders/7", "같은 내용으로 덮어씀", "✓"]
      - ["DELETE /orders/7", "이미 지운 걸 또 지움", "✓"]
      - ["POST /orders", "주문이 두 개", "✗ → Idempotency-Key"]
    colw: [3.6, 4.6, 3.9]
    mono_col: 0
    callout: "너무 많이 부르면 429 + Retry-After — 폭주 트래픽에서 서버를 지킨다"
    callout_color: orange

  - type: statement
    icon: KeyRound
    title: "트렌드 — 비밀번호 없는 로그인"
    text: "사람은 패스키, 기계는 OIDC\n오래 사는 비밀을 없애는 쪽으로"
    sub: "패스키(FIDO2/WebAuthn)는 기기의 개인 열쇠로 서명 — 피싱에 강하다. RFC 6749(2012) → RFC 7519(2015) → RFC 9700(2025)"
    notes: "Hardt (2012) RFC 6749. Jones et al. (2015) RFC 7519. Lodderstedt et al. (2025) RFC 9700."

  - type: quiz
    title: "8교시 확인 문제"
    questions:
      - "로그인은 됐는데 관리자 페이지 거절 — 401? 403?"
      - "서버 3대로 늘리자 로그인이 풀린다(세션) — 고칠 곳은?"
      - "JWT에 비밀번호를 넣어도 되나?"
      - "결제 POST를 두 번 처리하지 않게 하는 장치는?"
    answers: "1) 403  2) 세션을 공용 저장소(Redis)로  3) 안 된다 — 누구나 읽는다  4) 멱등 키"

