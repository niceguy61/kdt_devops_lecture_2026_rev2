  - type: quiz
    title: "7교시 확인 문제"
    questions:
      - "응답을 자동 허용하는 방화벽 종류와 AWS 이름은?"
      - "SSH(22)를 0.0.0.0/0으로 열면 생기는 위험은?"
      - "/api와 /를 다른 서버로 보내려면 AWS의 어떤 LB?"
      - "'절대 믿지 말고 항상 확인하라' 보안 모델은?"
    answers: "1) 상태 있는 방화벽, 보안 그룹  2) 전 세계 공격 봇의 표적 — 내 IP(/32)로 제한  3) ALB  4) 제로 트러스트"

  - type: summary
    title: "오늘 하루 정리"
    items:
      - ["1교시", "데이터는 패킷으로, 층마다 포장(캡슐화) — 거리 = 지연 시간"]
      - ["2교시", "사설 IP + NAT, 주소 개수 = 2^(32−n), 0.0.0.0/0 = 인터넷 전체"]
      - ["3교시", "refused는 받을 프로그램 없음, timed out은 방화벽 — 컨테이너는 0.0.0.0"]
      - ["4교시", "DNS = 계층·위임·캐시, 바꿨는데 안 바뀌면 TTL"]
      - ["5~6교시", "4xx는 요청 쪽, 5xx는 서버 쪽 — 장애는 요청의 여정 앞에서부터"]
      - ["7교시", "보안 그룹은 상태 있는 방화벽, 헬스 체크는 자동 복구의 시작"]
    diary: "배움일기 — 2주차 Docker에서 바로 쓸 것 하나 · 에러 표(refused, timed out…)를 내 말로 · 내일(현대 앱 구조) 전에 궁금한 것"
    notes: "내일은 현대 애플리케이션 구조. 오늘 그린 요청의 여정 ⑥~⑧(앱·캐시·DB)을 확대한다."
