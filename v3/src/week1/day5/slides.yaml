meta:
  footer: "1주차 5일차 · DevOps 문화와 협업"
  title: "1주차 5일차 — DevOps 문화와 협업"

slides:
  - type: cover
    kicker: "CLOUD NATIVE DEVOPS · 기초 이론 과정"
    title: "DevOps 문화와 협업"
    subtitle: "1주차 5일차 · DevOps의 탄생 · SDLC와 CI/CD · Git과 GitHub · 타 부서 협업 · 장애 커뮤니케이션 · 문서 · 2주차 준비"
    notes: "기술을 다루는 사람과 팀을 보는 날. 신입이 가장 먼저 부딪히는 벽은 기술보다 소통인 경우가 많다."

  - type: agenda
    title: "오늘의 흐름"
    items:
      - ["1교시", "1", "DevOps는 왜 생겼나"]
      - ["2교시", "2", "SDLC와 CI/CD"]
      - ["3교시", "3", "Git과 GitHub 맛보기 (시연)"]
      - ["4교시", "4", "타 부서와 협업하기"]
      - ["5교시", "5", "장애 커뮤니케이션과 포스트모템"]
      - ["6교시", "6", "문서로 일하기"]
      - ["7교시", "7", "처음부터 보안 — DevSecOps와 비밀값"]
      - ["8교시", "8", "손으로 맞추는 실행 환경 (시연) + 2주차 준비"]
    notes: "8교시는 1주차 배움일기와 회고."

  # 1교시
  - type: section
    num: "1교시"
    title: "DevOps는 왜 생겼나"
    goals: ["어제 10분 요약", "혼란의 벽", "DevOps의 탄생과 CALMS", "웨스트럼 조직 문화"]
    notes: "어제의 콘웨이 법칙 — 오늘은 조직과 소통을 정면으로."

  - type: table
    title: "어제 10분 요약"
    head: ["어제 배운 것", "한 문장"]
    rows:
      - ["현대 앱의 지도", "애플리케이션 = 코드 + 실행 조건"]
      - ["프론트 · 백엔드", "API는 약속, stateless여야 늘릴 수 있다"]
      - ["확장성 · 가용성", "스케일 아웃, 9의 개수, SPOF 제거, CAP"]
      - ["데이터 · 캐시 · 큐", "RDB는 ACID, 큐는 맡겨 두기 — 대가는 멱등성"]
      - ["MSA", "조직 문제를 풀고 분산 시스템 문제를 떠안는다"]
    colw: [3.4, 8.7]
    callout: "콘웨이의 법칙 — 시스템은 조직의 의사소통 구조를 닮는다. 오늘은 '조직' 쪽을 본다"
    notes: "학생에게 먼저 말해 보게 하기."

  - type: image
    title: "혼란의 벽 — 개발과 운영이 갈라져 있던 시절"
    img: week1/day5/w1d5-wall.png
    notes: "평가 기준이 다르면 원하는 것이 다르다. 개발은 몇 달 만에 크게 배포, 배포 날은 장애 날. 비유: 요리사와 홀 직원."

  - type: steps
    title: "학술 노트 — DevOps의 탄생 (2009)"
    steps:
      - ["2009.6 Velocity", "Flickr 올스포 · 해먼드 '하루 10번 이상 배포'"]
      - ["핵심", "도구가 아니라 신뢰 · 공유된 목표 · 존중"]
      - ["2009.10 겐트", "드부아의 첫 DevOpsDays"]
      - ["#DevOps", "행사 해시태그가 운동의 이름이 되다"]
    notes: "Allspaw & Hammond (2009) Velocity. Kim et al. (2016) The DevOps Handbook."

  - type: image
    title: "DevOps의 다섯 기둥 — CALMS"
    img: week1/day5/w1d5-calms.png
    callout: "'Kubernetes를 쓰니까 DevOps'는 반만 맞다 — 도구는 다섯 중 하나"
    callout_color: orange
    notes: "DevOps 엔지니어 · SRE · 플랫폼 엔지니어: 이름과 범위는 달라도 '개발자가 빠르고 안전하게 배포할 길을 만드는 사람'."

  - type: table
    title: "학술 노트 — 웨스트럼의 조직 문화 (2004)"
    head: ["유형", "정보의 흐름", "실패가 생기면"]
    rows:
      - ["병리적 (권력 지향)", "정보를 무기로 쥔다", "희생양을 찾는다"]
      - ["관료적 (규칙 지향)", "규정 경로로만", "처벌하거나 규정 탓"]
      - ["생성적 (성과 지향)", "필요한 사람에게 흐른다", "조사하고 배운다"]
    colw: [3.6, 4.2, 4.3]
    callout: "DORA 연구 — 생성적 문화일수록 배포 성과와 조직 성과가 높다 (측정 가능한 차이)"
    notes: "Westrum (2004) BMJ Quality & Safety. Forsgren, Humble & Kim (2018) Accelerate."

  - type: statement
    icon: Bot
    title: "트렌드 — AI 시대의 DevOps"
    text: "AI로 코드는 빨라졌다\n리뷰 · 테스트 · 배포가 받쳐 주지 못하면 병목만 뒤로 밀린다"
    sub: "DORA 2025 'AI는 증폭기' — 작게 자주 배포, 자동 검증, 빠른 되돌리기가 AI 코드를 안전하게 받아들이는 방법"
    notes: "AI 시대에 DevOps는 오히려 더 중요해진다."

  - type: quiz
    title: "1교시 확인 문제"
    questions:
      - "개발팀과 운영팀이 원하던 것은 각각?"
      - "2009년 Flickr 발표 제목의 숫자는?"
      - "CALMS의 다섯 글자는?"
      - "실패가 생기면 '조사하고 배우는' 문화는?"
    answers: "1) 변화, 안정  2) 10 (하루 10번 이상 배포)  3) 문화 · 자동화 · 린 · 측정 · 공유  4) 생성적 문화"

  # 2교시
  - type: section
    num: "2교시"
    title: "SDLC와 CI/CD"
    goals: ["소프트웨어 개발 생명주기", "폭포수 vs 애자일", "CI · CD", "파이프라인 = 품질 관문"]
    notes: "3주차 GitHub Actions, 4주차 Argo CD의 개념적 바탕."

  - type: table
    title: "소프트웨어 개발 생명주기 (SDLC)"
    head: ["단계", "주로 누가", "DevOps의 관심사"]
    rows:
      - ["계획 · 설계", "기획 · 개발", "필요한 인프라, 확장성, 비용"]
      - ["개발", "개발", "개발 환경, 브랜치 전략"]
      - ["테스트", "QA · 개발", "자동 테스트"]
      - ["배포", "운영 · DevOps", "배포 자동화, 되돌리기"]
      - ["운영 · 피드백", "운영 · SRE", "모니터링, 장애 대응, 지표"]
    colw: [2.8, 3.2, 6.1]
    notes: "회사마다 이름은 달라도 대체로 이 단계."

  - type: image
    title: "폭포수 vs 애자일"
    img: week1/day5/w1d5-waterfall-agile.png
    notes: "비유: 완성된 요리를 한 번에 vs 한 숟가락씩 맛보며 간 맞추기."

  - type: compare
    title: "학술 노트 — 폭포수의 오해와 애자일 선언"
    left: ["Royce (1970)", ["유명한 '폭포수' 그림의 출처", "그런데 그 아래에 '위험하다'고 씀", "피드백과 반복을 넣으라고 주장", "비판 대상의 그림이 이름을 얻다"]]
    right: ["애자일 선언 (2001.2)", ["공정과 도구보다 개인과 상호작용", "문서보다 작동하는 소프트웨어", "계약보다 고객과의 협력", "계획보다 변화에 대응"]]
    notes: "DevOps는 애자일 정신을 운영과 배포까지 넓힌 것."

  - type: image
    title: "CI/CD 파이프라인"
    img: week1/day5/w1d5-cicd.png
    callout: "자동화는 종료 코드만 본다 — 0이면 다음으로, 아니면 멈춘다"
    notes: "CI: 자주 합치고 매번 자동 빌드·테스트 (통합 지옥 해결). 지속적 전달 = 운영 배포 버튼은 사람, 지속적 배포 = 운영까지 자동."

  - type: compare
    title: "학술 노트 — CI와 CD의 정리"
    left: ["CI — Fowler (2000/2006)", ["XP(켄트 벡)에서 시작", "모두가 매일 메인 라인에 커밋", "모든 커밋은 빌드된다", "깨진 빌드는 즉시 고친다"]]
    right: ["CD — Humble & Farley (2010)", ["배포 파이프라인 체계화", "'배포가 고통스러우면 더 자주 하라'", "자주 하면 작아지고 자동화된다", "배포가 지루할 만큼 평범해진다"]]
    notes: "Fowler (2006) Continuous Integration. Humble & Farley (2010) Continuous Delivery."

  - type: cards
    title: "트렌드 — 공급망 보안이 파이프라인에"
    cards:
      - [FileText, teal, "SBOM", "무슨 재료로 만들었나 — 소프트웨어 자재 명세서"]
      - [PenLine, orange, "서명", "결과물에 서명해 위변조를 막는다"]
      - [ShieldCheck, violet, "SLSA", "빌드 과정의 신뢰 수준 표준"]
      - [ArrowLeft, red, "시프트 레프트", "보안을 마지막이 아니라 앞쪽으로"]
    notes: "1일차: AI 패키지 환각(USENIX 2025). 공급망 공격 증가."

  - type: quiz
    title: "2교시 확인 문제"
    questions:
      - "폭포수와 애자일의 가장 큰 차이는?"
      - "몇 주 만에 코드를 합칠 때 생기던 문제는?"
      - "지속적 전달과 지속적 배포의 차이는?"
      - "'배포가 고통스러우면 ○○ ○○ 하라'"
    answers: "1) 한 번에 크게 vs 작게 자주  2) 통합 지옥  3) 운영 배포를 사람이 결정 vs 자동  4) 더 자주"

  # 3교시
  - type: section
    num: "3교시"
    title: "Git과 GitHub 맛보기 (강사 시연)"
    goals: ["버전 관리가 필요한 이유", "세 영역과 커밋", "브랜치와 Pull Request", "Git vs GitHub"]
    notes: "1주차는 보기만. 2주차 1일차에 직접 입력."

  - type: statement
    icon: Files
    title: "보고서_최종_진짜최종_v3.docx"
    text: "무엇이 언제, 왜 바뀌었는지 모른다\n두 사람이 동시에 고치면 누구 것을 살리나?"
    sub: "버전 관리 시스템 — 변경 이력을 기록하고, 여러 사람의 변경을 안전하게 합친다 · 현업 표준은 Git"
    notes: "학생들에게 이런 파일 이름을 써 본 적 있는지 물어보기."

  - type: image
    title: "Git의 세 영역과 커밋"
    img: week1/day5/w1d5-git-areas.png
    notes: "시연: git init → status → add → commit → log → switch -c → push. 커밋 메시지에는 무엇을, 왜."

  - type: compare
    title: "커밋 메시지 — 무엇을, 왜"
    left: ["나쁜 메시지", ["수정", "asdf", "최종"]]
    right: ["좋은 메시지", ["로그인 실패 시 에러 메시지 표시", "DB 연결 타임아웃 5초→10초 (피크 시간 연결 실패)", "상품 목록 API에 페이지 나누기 추가"]]
    notes: "비밀값(비밀번호, API 키, AWS Access Key)은 절대 커밋 금지 — 지워도 이력에 남고 봇이 몇 분 안에 찾아낸다. .env는 .gitignore에."

  - type: image
    title: "브랜치와 Pull Request"
    img: week1/day5/w1d5-branch-pr.png
    callout: "코드 리뷰는 감시가 아니라 학습 — 코멘트는 사람이 아니라 코드에 대해"
    notes: "비유: 공동 문서의 제안 모드. main은 항상 검토된 코드만. 리뷰는 사람 SPOF도 줄인다."

  - type: compare
    title: "Git vs GitHub · 학술 노트 — 2주 만에 만든 Git (2005)"
    left: ["Git ≠ GitHub", ["Git: 내 컴퓨터의 버전 관리 프로그램", "GitHub: 저장소 호스팅 서비스", "PR · 리뷰 · 이슈 · Actions(CI/CD)", "비슷한 것: GitLab, Bitbucket"]]
    right: ["Torvalds (2005.4)", ["BitKeeper 무료 사용 중단", "며칠 만에 자기 소스 관리", "분산 — 모두가 전체 이력 사본", "해시로 위변조 감지 · SPOF 없음"]]
    notes: "Chacon & Straub (2014) Pro Git."

  - type: cards
    title: "트렌드 — Octoverse 2026"
    cards:
      - [Users, teal, "2억 2,500만+", "GitHub 개발자 수 (2026년 9월)"]
      - [Bot, orange, "40%+", "AI 에이전트가 시작한 PR (2026년 9월, 3월엔 17%)"]
      - [GitMerge, violet, "13억 개", "1년간 병합된 PR — 리뷰와 자동 검사가 병목"]
      - [Code, teal, "TypeScript 1위", "2년 연속 가장 많이 쓰는 언어"]
    notes: "GitHub Octoverse 2026 (2026-10-28 발표, 2025.10~2026.9 집계). push 179억 번 — 2024·2025년 합계보다 많음. Actions 작업 454억 번. 집계 방식이 바뀌어 옛 보고서 숫자와 직접 비교는 주의."

  - type: quiz
    title: "3교시 확인 문제"
    questions:
      - "이번 커밋에 담을 변경을 고르는 명령은?"
      - "좋은 커밋 메시지에 꼭 들어갈 두 가지는?"
      - "main을 직접 고치지 않고 '합쳐 주세요'라고 요청하는 것은?"
      - "Git이 '분산' 버전 관리라는 뜻은?"
    answers: "1) git add  2) 무엇을, 왜  3) Pull Request  4) 모두가 전체 이력의 완전한 사본을 가진다"

  # 4교시
  - type: section
    num: "4교시"
    title: "타 부서와 협업하기"
    goals: ["함께 일하는 사람들", "요청을 잘 쓰는 법", "비기술자에게 설명하기", "팀 구조와 심리적 안전감"]
    notes: "DevOps 엔지니어는 가장 많은 부서와 이야기하는 사람 중 하나."

  - type: image
    title: "DevOps 엔지니어의 협업 지도"
    img: week1/day5/w1d5-stakeholders.png
    callout: "모두가 옳다, 다만 원하는 것이 다를 뿐 — 양쪽 목표를 모두 만족하는 선택지를 찾는다"
    notes: "보안의 '안 됩니다'는 방해가 아니라 자기 책임을 다하는 것."

  - type: table
    title: "요청을 잘 쓰는 법 — 보안팀에 포트 개방 요청"
    head: ["항목", "내용"]
    rows:
      - ["무엇을", "결제 API 서버 보안 그룹에 인바운드 TCP 443"]
      - ["어디에서", "결제 대행사 IP 대역 203.0.113.0/24만"]
      - ["왜", "결제 결과 웹훅(callback)을 받아야 함"]
      - ["언제까지", "12월 5일 출시, 12월 3일까지 테스트"]
      - ["위험과 대안", "0.0.0.0/0 대신 대행사 IP로 제한"]
      - ["되돌리기", "출시 취소 시 규칙 삭제, 담당자 명시"]
    colw: [2.6, 9.5]
    callout: "나쁜 요청: '포트 좀 열어 주세요. 급해요.' — 상대가 물을 질문에 미리 답한다"
    callout_color: orange
    notes: "3일차 /32, 보안 그룹 표가 여기서 쓰인다. 1일차 좋은 질문의 다섯 줄과 같은 원리."

  - type: compare
    title: "기술을 모르는 사람에게 설명하기"
    left: ["하지 말 것", ["약어 그대로 ('ALB 타깃 그룹이…')", "원인부터 길게", "'곧 됩니다'", "추정을 단정"]]
    right: ["할 것", ["결과부터 쉬운 말로", "영향 → 원인 → 대응 → 예상 시간", "'30분 안에 다시 알려 드리겠습니다'", "'현재까지 확인된 것은…' + 비유"]]
