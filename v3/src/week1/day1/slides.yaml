      - "'큰돈 없이 시작하고 쓰는 만큼 낸다'는 CAPEX와 OPEX 중 어느 쪽?"
      - "EKS 클러스터를 30일 켜 두면 컨트롤 플레인 요금만 대략 얼마?"
      - "서울 리전의 코드는?"
    answers: "1) 고객(EC2는 IaaS)  2) OPEX  3) 약 $72 + 노드·NAT·LB 별도  4) ap-northeast-2"

