    notes: "클라우드를 이해하려면 먼저 클라우드가 없을 때 무엇을 직접 해야 했는지 알아야 합니다."

  - type: statement
    icon: ChefHat
    title: "서버 = 식당의 주방"
    text: "손님(클라이언트)은 주문서(요청)를 내고, 주방(서버)은 요리(응답)를 내보낸다"
    sub: "서버를 운영한다는 것은 주방 설비·가스·위생·요리사 근무표까지 책임지는 것"
    notes: "서버도 결국 컴퓨터(CPU·메모리·디스크·NIC)입니다. 다만 24시간 켜져 있고 많은 요청을 동시에 처리해야 합니다."

  - type: steps
    title: "연말 행사로 방문자가 10배 — 직접 운영한다면"
    steps:
