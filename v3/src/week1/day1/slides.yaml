    answers: "1) 실행 환경·보안·인프라·배포·모니터링·비용·장애 대응·문서 중 4개  2) 모든 사용자에게 권한이 필요한지 — 보통 chmod +x 또는 755면 충분  3) 조건 확인 → 안전 확인 → 실행 검증 → 기록  4) 슬롭스쿼팅"

  # ───────── 4교시
  - type: section
    num: "4교시"
    title: "데이터센터에서 클라우드까지"
