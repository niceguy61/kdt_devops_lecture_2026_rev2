    icon: ShieldAlert
    title: "이 사고는 누구 책임일까?"
    text: "S3 버킷을 실수로 '누구나 읽기'로 공개 → 고객 개인정보 유출"
    sub: "정답: 고객 책임 — 공개 여부를 정하는 설정은 고객이 했기 때문.  클라우드 보안 사고의 상당수는 '설정 실수'에서 시작됩니다"
    notes: "AWS는 현재 새 버킷에 퍼블릭 접근 차단을 기본값으로 적용합니다. 5주차에 직접 확인합니다."


  - type: statement
    icon: ShieldAlert
    title: "업계 분석 — 클라우드 보안 실패의 99%는?"
    text: "\"2025년까지 클라우드 보안 실패의 99%는\n고객의 잘못에서 비롯될 것\" — Gartner (2019)"
    sub: "대형 유출 사고의 상당수는 해킹 기술이 아니라 공개된 저장소·과도한 권한·유출된 키 같은 '설정'에서 시작됐습니다"
    notes: "그래서 클라우드 보안 공부의 대부분은 '내가 만든 설정을 안전하게 만드는 법'. 4주차 RBAC·정책, 5주차 IAM·보안 그룹."
