      - ["배포·되돌리기", "새 버전은 어떻게 올리고, 문제가 생기면 어떻게 되돌리나?"]
      - ["모니터링", "지금 정상인지 무엇으로 판단하나? 느려지면 누가 아나?"]
      - ["비용", "한 달에 얼마? 사용자가 10배 늘면?"]
      - ["장애 대응", "새벽 3시에 멈추면 누가, 무엇을 보고, 어떻게 복구하나?"]
      - ["문서·인수인계", "내가 휴가 가면 다른 사람이 운영할 수 있나?"]
    colw: [2.8, 9.3]
