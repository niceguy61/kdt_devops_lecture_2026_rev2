      - ["주문", "서버 주문, 몇 주 배송 대기"]
      - ["시설", "공간·전력·냉각·회선 확보"]
      - ["설치", "랙 설치, OS, 네트워크 연결"]
      - ["행사 후", "늘어난 서버는 그대로 남음"]
    notes: "적게 사면 사이트가 멈추고, 많이 사면 돈이 남습니다. 이 일을 대신해 주는 곳이 데이터센터, 아예 서비스로 바꾼 것이 클라우드입니다."

  - type: image
