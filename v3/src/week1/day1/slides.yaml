      - ["기록", "누가 무엇을 바꿨는지", "에이전트가 실행한 명령을 로그로"]
      - ["격리", "운영/개발 환경 분리", "에이전트는 실습·개발 환경에서만"]
    colw: [2.4, 4.1, 5.6]
    callout: "MCP 같은 표준으로 AI가 GitHub·DB·클라우드에 직접 연결되는 시대 = '권한을 가진 새 사용자'"
    notes: "MCP(Model Context Protocol)는 2024년 말 Anthropic이 공개. 4주차 RBAC, 5주차 IAM에서 이 원칙을 기술로 구현한다."
  - type: compare
    title: "학술 노트 — 왜 원리를 알아야 하나"
    left: ["자동화 편향", ["자동화된 제안을 지나치게 믿는 경향", "틀린 제안도 확인 없이 따름", "Parasuraman & Manzey (2010)"]]
    right: ["자동화의 아이러니 (Bainbridge, 1983)", ["자동화가 잘될수록 사람의 실력은 녹슨다", "그런데 자동화가 실패하면 가장 어려운 문제는 사람 몫", "AI 시대, 장애 때 원리를 아는 사람의 가치는 더 커진다"]]
    notes: "Bainbridge, L. (1983). Ironies of automation. Automatica 19(6). 항공·의료에서 오래 연구된 주제."
  - type: cards
