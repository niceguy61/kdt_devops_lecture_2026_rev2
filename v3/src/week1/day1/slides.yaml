    notes: "AWS는 2006년 3월 S3, 8월 EC2를 출시했습니다. Docker는 2013년 공개, Kubernetes는 2014년 발표·2015년 1.0. 서버가 '사는 물건'에서 '요청하는 서비스'로 바뀌어 왔습니다."

