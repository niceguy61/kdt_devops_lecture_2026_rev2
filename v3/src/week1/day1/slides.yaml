    notes: "AI는 대부분 맞지만 가끔 오래된 정보, 내 환경과 맞지 않는 명령, 위험한 명령을 자신 있게 제시합니다."

  - type: table
    title: "실행 전에 반드시 멈춰야 하는 명령"
    head: ["명령 예시", "무엇이 위험한가", "확인할 것"]
    rows:
      - ["rm -rf <경로>", "확인 없이 영구 삭제", "경로가 정확한가? 변수가 비어 있지 않은가?"]
      - ["chmod 777 <파일>", "누구나 읽기·쓰기·실행", "정말 모두에게 권한이 필요한가?"]
      - ["보안 그룹 0.0.0.0/0", "전 세계에서 접근 가능", "이 포트를 정말 모두에게 열어야 하나?"]
      - ["코드에 Access Key", "Git에 올라가면 계정 탈취", "환경 변수·비밀 관리 도구를 쓸 수 있나?"]
      - ["kubectl delete namespace", "안의 리소스 전부 삭제", "지금 어느 클러스터에 연결돼 있나?"]
      - ["terraform destroy", "관리하던 인프라 전체 삭제", "실습 환경이 맞나?"]
    colw: [3.4, 3.6, 5.1]
    mono_col: 0
    notes: "모두 이 과정에서 실제로 만나는 명령입니다. 뜻을 모르면 절대 그대로 실행하지 않습니다."


  - type: statement
    icon: PackageX
    title: "새로운 위험 — 슬롭스쿼팅 (slopsquatting)"
    text: "AI가 지어낸 '없는 패키지' 이름으로\n공격자가 악성 패키지를 미리 등록해 둔다"
    sub: "USENIX Security 2025: 16개 모델·57만 6천 개 코드 분석 — 없는 패키지 비율 상용 5.2%, 오픈소스 21.7%. 설치 전 공식 저장소에서 존재·관리자·다운로드 수 확인"
    notes: "Spracklen et al. (2025). 지어낸 고유 이름 20만 5천여 개. 기존 타이포스쿼팅의 변형."
  - type: table
    title: "AI 에이전트에게도 같은 원칙을"
    head: ["원칙", "사람에게", "AI 에이전트에게"]
    rows:
