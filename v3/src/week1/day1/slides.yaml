    notes: "Armbrust et al. (2009). Above the Clouds: A Berkeley View of Cloud Computing. UCB/EECS-2009-28. 클라우드 분야에서 가장 많이 인용되는 문헌 중 하나. 5교시 CAPEX/OPEX와 연결."
