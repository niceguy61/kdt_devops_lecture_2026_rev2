  # ───────── 1교시
  - type: section
    num: "1교시"
    title: "과정 OT — 수업 방식과 약속"
    goals: ["5주 뒤 할 수 있게 되는 것", "하루 수업의 리듬", "막혔을 때 질문하는 법", "계정과 비밀값을 지키는 약속"]
    notes: "이번 시간은 앞으로 5주를 버티기 위한 규칙을 정하는 시간입니다."

  - type: table
    title: "5주 뒤 여러분이 할 수 있게 되는 것"
    head: ["할 수 있게 되는 일", "주차"]
    rows:
      - ["서버·네트워크·클라우드 용어를 그림으로 설명하기", "1주"]
      - ["내 앱을 Docker 이미지로 포장하고 실행하기", "2주"]
      - ["Git·GitHub로 코드 관리하고 협업하기", "2~3주"]
      - ["MSA를 띄우고 장애 원인 찾기", "3주"]
      - ["Kubernetes에 배포하고 관찰하기", "3~4주"]
      - ["Git에 올리면 자동 배포되는 GitOps 만들기", "4주"]
      - ["AWS 인프라를 만들고 Terraform 코드로 다시 만들기", "5주"]
      - ["EKS에 앱을 올리고 안전하게 정리하기 ← 도착점", "5주"]
    colw: [9.6, 2.5]
    notes: "표의 마지막 줄이 도착점입니다. 오늘은 '이런 걸 하게 되는구나' 정도만 느끼면 충분합니다."

  - type: cards
    title: "난이도는 점점 올라갑니다"
    cards:
      - [Laptop, teal, "1주 ★", "개념과 그림, 강사 시연. 직접 실습 없음"]
      - [Container, teal, "2주 ★★", "첫 실습. 한 단계씩 따라 하기"]
      - [Boxes, violet, "3주 ★★★", "MSA와 Kubernetes 입문"]
      - [Gauge, violet, "4주 ★★★★", "운영 도구. 하루 한 도구"]
      - [Cloud, orange, "5주 ★★★★★", "내 AWS 계정에서 만들고 당일 삭제"]
    callout: "3주차부터 '나만 모르는 것 같다'는 느낌은 거의 모두가 똑같이 겪습니다. 정상입니다."
    notes: "어려워지는 게 정상이라는 메시지를 분명히 전달합니다. 모르는 것을 배움일기에 적어 두면 두세 번 보면서 연결된다고 안내합니다."

  - type: image
    title: "하루 8교시의 리듬"
    img: week1/day1/w1d1-day-rhythm.png
    notes: "50분 수업 10분 휴식. 1교시 처음 10분은 어제 요약, 8교시는 배움일기. 오늘은 OT라 5교시까지."


  - type: image
    title: "이 과정은 왜 이렇게 설계되었나 — 학습 과학"
    img: week1/day1/w1d1-learning-science.png
    callout: "1주차에 실습이 없는 것도, 매 교시 퀴즈도 '연구 결과'에 근거한 설계입니다"
    notes: "Sweller(1988) 인지 부하 이론: 작업 기억은 작다. 처음 개념이 쏟아질 때 설치·오타 같은 외재적 부하까지 겹치면 넘친다. 예제 학습 효과와 전문성 역전 효과(Kalyuga 2003): 초보자는 완성된 예제를 따라갈 때 더 잘 배운다. 인출 연습(Roediger & Karpicke 2006): 다시 읽기보다 꺼내 보기가 일주일 뒤 기억을 더 많이 남긴다. 망각 곡선(Ebbinghaus 1885)과 간격 효과. 바람직한 어려움(Bjork 1994): 적당히 힘든 학습이 오래 남는다."
  - type: compare
    title: "배움일기 — 내일의 나를 위한 메모"
    left: ["네 칸만 채우면 됩니다", ["오늘 이해한 것", "막힌 것", "다시 해볼 것", "내일 물어볼 것"]]
    right: ["예시", ["클라우드는 서버를 빌려 쓰는 방식이다", "IaaS와 PaaS의 경계가 헷갈린다", "피자 비유 그림을 내 말로 설명해 보기", "EC2가 IaaS면 EKS는 무엇인가?"]]
    notes: "길게 쓸 필요가 없습니다. 짧은 메모도 좋고, 블로그로 정리해도 좋습니다."

  - type: statement
    icon: Timer
    title: "막혔을 때 — 15분 규칙"
    text: "혼자서 15분 동안 에러를 읽고, 검색하고, 다시 시도한다.\n15분이 지나도 진전이 없으면 반드시 질문한다."
    sub: "혼자 한 시간을 붙잡고 있는 것은 성실함이 아니라 시간 낭비입니다"
    notes: "현업 엔지니어도 하루의 상당 시간을 '왜 안 되지?'를 푸는 데 씁니다. 막히는 것은 실력 부족이 아닙니다."

  - type: image
    title: "질문을 '증거'로 바꾸기 — 다섯 줄 질문"
    img: week1/day1/w1d1-good-question.png
    notes: "좋은 질문에는 답의 절반이 들어 있습니다. 다섯 줄로 정리하다 보면 스스로 해결되는 경우도 많습니다. 에러 메시지는 요약하지 말고 원문을 복사합니다."


  - type: statement
    icon: Users
    title: "2026 트렌드 — AI가 있어도 결국 사람에게 묻는다"
    text: "업무에 AI를 전혀 안 쓰는 개발자는 17.2%뿐\n그래도 막히면 동료에게 묻는다 72% · 중요한 결정을 AI에 맡긴다 6.6%"
    sub: "출처: Stack Overflow 2026 Developer Survey (169개국 약 3만 명, 2026년 10월). 다섯 줄 질문은 사람에게도 AI에게도 통합니다"
    notes: "러버덕 디버깅: 고무 오리에게 설명하다 보면 스스로 실수를 발견한다(『실용주의 프로그래머』, 1999). 다섯 줄 질문을 쓰다 혼자 해결되는 것도 같은 원리."
  - type: table
    title: "계정과 비밀값을 지키는 약속"
    head: ["약속", "이유"]
    rows:
      - ["비밀번호·토큰·Access Key·MFA 코드는 화면 공유·채팅·스크린샷에 노출 금지", "노출된 키로 남이 내 계정을 쓸 수 있음"]
      - ["질문용 스크린샷은 키·계정 번호를 가린 뒤 올리기", "화면 한 장으로도 유출됨"]
      - ["비밀값을 코드나 GitHub에 올리지 않기", "자동 수집 봇이 실시간으로 훑음"]
      - ["AWS 리소스는 안내 범위만 만들고 끝나면 삭제", "켜 둔 리소스는 계속 과금"]
    colw: [7.2, 4.9]
    callout: "Git은 지운 기록까지 보관합니다. '잠깐 올렸다 지웠다'도 안전하지 않습니다."
    notes: "AWS 계정은 신용카드가 연결된 계정입니다. Access Key가 공개 저장소에 올라가면 몇 분 안에 봇이 찾아 채굴 서버를 띄우는 사례가 반복 보고됩니다."

  - type: table
    title: "준비물 — 1주차에는 아무것도 설치하지 않습니다"
    head: ["항목", "권장", "최소"]
    rows:
      - ["운영체제", "Windows 11 / 최신 macOS", "Windows 10 (WSL2 가능 버전)"]
      - ["메모리(RAM)", "16GB 이상", "8GB (3~4주차 K8s가 느릴 수 있음)"]
      - ["저장 공간", "여유 50GB 이상", "여유 30GB"]
      - ["계정", "GitHub 계정", "—"]
    colw: [2.8, 4.4, 4.9]
    callout: "설치는 2주차 1일차에 함께 진행합니다. AWS 계정은 5주차 직전에 따로 안내합니다."
    notes: "노트북 사양을 미리 확인하게 합니다. 8GB 노트북은 4주차에 클러스터가 느릴 수 있음을 미리 알려 둡니다."

  - type: quiz
    title: "1교시 확인 문제"
    questions:
      - "막히면 몇 분 동안 혼자 시도한 뒤 질문하기로 했나요?"
      - "다섯 줄 질문의 항목을 모두 말해 보세요."
      - "Access Key를 GitHub에 올렸다가 1분 만에 지웠습니다. 안전할까요?"
      - "매 교시 확인 문제를 푸는 것과 관련된 학습 과학 효과는?"
    answers: "1) 15분  2) 하려던 것·실행한 명령·보인 결과(원문)·시도한 것·환경  3) 안전하지 않음 — 봇이 몇 분 안에 찾고, Git은 지운 기록도 보관. 즉시 키 비활성화 후 재발급  4) 인출 연습 효과(Roediger & Karpicke, 2006)"

  # ───────── 2교시
  - type: section
    num: "2교시"
    title: "5주 로드맵과 DevOps 직무"
    goals: ["앱 하나의 여행", "기술은 '문제'에서 나왔다", "DevOps 한 문장", "이 과정이 향하는 직무"]
    notes: "기술 이름을 외우는 것이 아니라 '왜 등장했는지'를 연결하는 시간입니다."

  - type: image
    title: "앱 하나의 여행 — 5주 로드맵"
    img: week1/day1/w1d1-journey.png
    callout: "매주 앞 주에서 배운 것 위에 한 층씩 쌓아 올라갑니다"
    notes: "같은 앱 하나가 노트북 → 컨테이너 → MSA·K8s → 운영 도구 → AWS·Terraform → EKS로 이동합니다. 매주 앞 주 위에 한 층씩 쌓입니다."

  - type: table
    title: "모든 기술은 '문제'에서 나왔다"
    head: ["이런 문제가 생기면", "이 기술이 등장", "주차"]
    rows:
      - ["내 PC에선 되는데 서버에선 안 돼요", "Docker", "2주"]
      - ["코드를 누가 언제 바꿨는지 모른다", "Git / GitHub", "2주"]
      - ["컨테이너가 수십 개라 사람이 관리 못 한다", "Kubernetes", "3주"]
      - ["빌드·테스트를 매번 손으로 한다", "GitHub Actions", "3주"]
      - ["어디가 느린지 모르겠다", "Prometheus / Grafana", "4주"]
      - ["운영 설정이 Git과 달라져 있다", "Argo CD", "4주"]
      - ["서비스끼리의 통신을 통제하기 어렵다", "Istio", "4주"]
      - ["콘솔에서 클릭한 설정을 아무도 기억 못 한다", "Terraform", "5주"]
    colw: [6.6, 3.7, 1.8]
    notes: "책에는 전체 표가 있습니다. 슬라이드에서는 대표 문제만 짚고, 학생에게 '다음 문제는 무엇일까?'를 물어보며 진행합니다."

  - type: statement
    icon: Truck
    title: "비유 — 이삿짐 센터"
    text: "규격 상자(Docker)에 담고 → 물류 센터(Kubernetes)가 배치하고\n→ 배송 주문서(Git)가 바뀌면 자동 배송(Argo CD)\n→ 물류 센터 건물은 임대(AWS), 임대 계약서는 문서로(Terraform)"
    sub: "기술 이름보다 '어떤 불편함을 해결하는가'로 기억하세요"
    notes: "비유는 큰 그림 잡기용입니다. 정확한 정의는 해당 주차에서 다시 배웁니다."

  - type: statement
    icon: Infinity
    title: "DevOps란 한 문장으로"
    text: "개발(Dev)과 운영(Ops) 사이의 벽을 허물고,\n변경을 빠르고 안전하게 사용자에게 전달하는 방식"
    sub: "도구 이름이 아니라 일하는 방식과 문화입니다 — 자세히는 5일차에"
    notes: "오늘은 '개발한 것이 서비스가 되기까지의 길을 책임지는 일' 정도로만 기억하게 합니다."


  - type: image
    title: "DevOps는 어떻게 탄생했나"
    img: week1/day1/w1d1-devops-history.png
    callout: "개발은 '빨리 바꾸고', 운영은 '안 멈추게' — 반대 목표 사이의 벽을 허물려는 움직임"
    notes: "혼돈의 벽(wall of confusion). 2003 구글 SRE, 2008 Debois & Shafer Agile Infrastructure, 2009 Allspaw & Hammond 'Flickr 하루 10번 배포' 발표, 같은 해 겐트 첫 DevOpsDays. 2013 피닉스 프로젝트, 2016 DevOps 핸드북과 SRE 책, 2018 Accelerate, 2025 DORA 'AI는 증폭기', 2026 Octoverse 'PR의 40% 이상을 에이전트가 시작'·DORA 연례 설문 중단과 ROI 보고서."
  - type: cards
    title: "CALMS — DevOps의 다섯 기둥"
    cards:
      - [Users, teal, "Culture", "비난하지 않고 함께 책임지는 문화"]
      - [Bot, teal, "Automation", "반복 작업은 기계에게"]
      - [Minimize2, orange, "Lean", "작게 만들고 빨리 확인"]
      - [ChartLine, orange, "Measurement", "느낌이 아니라 숫자로"]
      - [Share2, violet, "Sharing", "지식과 도구를 나누기"]
    notes: "John Willis와 Damon Edwards의 CAMS에 Jez Humble이 Lean을 더함. 각 기둥이 이 과정 어디서 나오는지 연결: 포스트모템, Actions/Argo CD/Terraform, 작은 PR, Prometheus/Grafana, README·runbook."
  - type: image
    title: "DORA 4대 지표 — DevOps를 숫자로 재는 법"
    img: week1/day1/w1d1-dora.png
    notes: "Nicole Forsgren 박사의 DORA 연구, 2018년 『Accelerate』. DORA는 2018년 구글 클라우드에 인수. 상위 팀은 배포를 더 자주 하면서도 실패율은 낮고 복구도 빠르다 — 작은 변경을 자주 내보내면 원인 찾기와 되돌리기가 쉽기 때문."
  - type: compare
    title: "학술 노트 — 콘웨이의 법칙과 오류 예산"
    left: ["콘웨이의 법칙 (1968)", ["시스템 설계는 조직의 소통 구조를 닮는다", "개발·운영 사이 벽 → 시스템에도 '던지고 받는' 경계", "MSA = '팀을 어떻게 나눌까'의 문제"]]
    right: ["SRE 오류 예산 (Google SRE, 2016)", ["가용성 99.9% → 한 달 약 43분 중단 허용", "예산이 남았으면 마음껏 배포", "다 쓰면 안정화에 집중 — 감정이 아닌 숫자로 결정"]]
    notes: "Conway, M. E. (1968). How do committees invent? Datamation. / Beyer et al. (2016). Site Reliability Engineering. 30일 × 24 × 60 × 0.001 = 43.2분."
  - type: image
    title: "이 과정이 향하는 직무"
    img: week1/day1/w1d1-roles.png
    notes: "회사마다 이름과 범위가 다르지만 주니어 채용 공고의 요구 사항은 크게 겹칩니다. Linux, 네트워크, 컨테이너, K8s, 클라우드, IaC, CI/CD — 이 과정의 5주입니다."

  - type: table
    title: "DevOps 엔지니어의 어느 하루 (예시)"
    head: ["시간", "하는 일"]
    rows:
