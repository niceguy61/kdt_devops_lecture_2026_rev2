  # ───────── 3교시
  - type: section
    num: "3교시"
    title: "AI 시대의 DevOps 마인드셋"
    goals: ["AI가 바꾼 것과 바꾸지 못한 것", "작은 앱 vs 운영 가능한 서비스", "AI 결과 검증 4단계", "실행 전에 멈춰야 하는 명령"]
