    notes: "대부분의 서버는 평소 CPU를 10~20%만 씁니다(예시). 하이퍼바이저가 물리 자원을 VM들에게 나눠 줍니다. EC2 인스턴스 = AWS 물리 서버 위의 VM 하나."


  - type: table
    title: "학술 노트 — 가상화의 세 조건 (Popek & Goldberg, 1974)"
    head: ["조건", "뜻", "쉬운 말로"]
    rows:
      - ["동등성", "VM 안 프로그램은 실제 기계와 똑같이 동작", "VM인지 모르고 돌아가야 한다"]
      - ["자원 통제", "하이퍼바이저가 모든 자원을 완전히 통제", "남의 메모리를 넘볼 수 없다"]
      - ["효율성", "대부분 명령은 CPU에서 바로 실행", "느려지면 안 된다"]
    colw: [2.2, 5.4, 4.5]
    callout: "x86은 이 조건을 완전히 못 맞춰 VMware(1999)가 우회 → Intel VT-x·AMD-V(2005~06)로 해결 → 클라우드 폭발"
    notes: "가상화의 뿌리는 1960년대 IBM CP-40/CP-67 메인프레임. 2017년부터 AWS Nitro: 네트워크·스토리지·보안 가상화를 전용 하드웨어로 떼어 내 VM이 물리 성능을 거의 그대로 쓴다."
