  - type: image
    title: "숫자로 보는 2026년의 AI 코딩"
    img: week1/day1/w1d1-ai-numbers.png
    notes: "Stack Overflow 2026(약 3만 명, 2026-10-06): AI 안 씀 17.2%, 코딩 어시스턴트·에이전트 66%, 검증할 수 있을 때만 믿음 약 절반, 중요한 결정 맡김 6.6%. Octoverse 2026(2026-10-28): 9월 PR의 40%+를 에이전트가 시작(3월 17%). DORA: 2025 연례(약 5,000명, 90% 사용, '증폭기')가 마지막 설문, 2026년 ROI 보고서는 J-커브와 검증 부담. METR: 2025 RCT 19% 더 오래 걸림/체감 20% 빨라짐, 2026년 후속은 AI 없이 일하기 거부로 설계 변경 중. Veracode 2026년 10월: 취약 과제 38%(여름 44%). 바이브 코딩 — Karpathy, 2025년 2월."
  - type: statement
    icon: Gauge
    title: "체감 vs 측정 — METR 무작위 대조 실험 (2025)"
    text: "숙련 개발자들은 'AI 덕분에 20% 빨라졌다'고 느꼈지만\n실제로는 19% 더 오래 걸렸다"
    sub: "AI 시대일수록 느낌이 아니라 '측정'으로 판단하는 습관이 중요합니다 (CALMS의 M)"
    notes: "Becker, Rush, Barnes, Rein (2025), arXiv:2507.09089. 결과는 '숙련자·자기 저장소·2025년 초 도구'라는 조건이 붙은 것이므로 일반화에 주의. METR도 2026년 2월 '지금은 개발자가 더 빨라졌을 가능성이 크지만 이 설계로는 잴 수 없다'며 실험을 다시 설계 중 — 핵심 교훈은 체감과 실제가 다를 수 있다는 점."
  - type: image
    title: "빙산 — 보이는 부분과 보이지 않는 부분"
    img: week1/day1/w1d1-app-vs-service.png
    notes: "물 위는 AI가 만들어 주는 화면과 코드. 물 아래 8가지가 서비스화에 필요한 것이고, 이 과정 5주 동안 배우는 내용입니다."

  - type: table
    title: "할 일 목록 앱을 회사 서비스로 공개한다면"
