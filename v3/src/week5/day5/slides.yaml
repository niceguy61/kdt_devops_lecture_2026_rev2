meta:
  footer: "5주차 5일차 · 통합 · 장애 · 정리 · 회고"
  title: "5주차 5일차 — 통합 · 장애 · 정리 · 회고"

slides:
  - type: cover
    kicker: "CLOUD NATIVE DEVOPS · 5주차 AWS + Terraform + EKS"
    title: "통합 · 장애 · 정리 · 회고"
    subtitle: "5주차 5일차 · 5주 지도 · up.sh · 커밋 하나, 클러스터 둘 · 노드와 AZ 장애 · 전부 지우기 · 비용 보고 · 회고 · 다음 걸음"
    notes: "어제 질문: 30분에 재현? 노드가 죽으면 db는? 마지막 날 — 5교시에 계정을 비운다."

  - type: agenda
    title: "오늘의 흐름"
    items:
      - ["1교시", "1", "4일차 요약 + 5주 지도"]
      - ["2교시", "2", "아침의 재현"]
      - ["3교시", "3", "커밋 하나, 클러스터 둘"]
      - ["4교시", "4", "클라우드 장애 훈련 — 노드와 AZ"]
      - ["5교시", "5", "전부 지우기 · 남은 것 찾기 · 비용 보고"]
      - ["6교시", "6", "5주 회고 + 포트폴리오"]
      - ["7교시", "7", "포트폴리오 발표"]
      - ["8교시", "8", "다음 걸음 — 30일 계획"]
    notes: "kind도 켜 둔다(3교시)."

  - type: section
    num: "1교시"
    title: "5주 지도"
    goals: ["남은 것 확인", "다섯 층", "꿰는 한 가지", "추상화의 누수"]
    notes: "leftovers.sh — 남긴 것은 state 버킷 · plan 역할 · OIDC 공급자뿐."

  - type: image
    title: "다섯 주의 지도"
    img: week5/day5/w5d5-course-map.png
    notes: "원하는 상태를 적어 두면 무언가가 맞춘다 — Dockerfile · Deployment · Git/Argo CD · .tf · ASG. 오해: 위층을 알면 아래층은 몰라도. 학술: Leaky Abstractions(Spolsky 2002). 트렌드: 플랫폼 엔지니어링."

  - type: section
    num: "2교시"
    title: "아침의 재현"
    goals: ["up.sh 읽기", "처음부터", "단계별 시간", "어제와 같은가"]
    notes: "스크립트 = 실행 가능한 런북. 각 단계는 선언적이라 멱등."

  - type: code
    title: "실습 1 · 명령 한 줄, 약 30분"
    code: |
      ~/devops-lab/aws/w5d5/up.sh
      terraform -chdir=… plan -detailed-exitcode; echo $?
      kubectl get application devmart -n argocd -o jsonpath='{.status.sync.status} {.status.health.status}'
    out: |2
      [0분 0초] 1. 클러스터 (Terraform)
      [16분 41초] 2. 플랫폼 (StorageClass · LBC · Envoy Gateway · Argo CD)
      [23분 12초] 3. Secret과 Application
      [27분 48초] 완료 — http://k8s-envoygat-….elb.ap-northeast-2.amazonaws.com/
      0                    ← 변경 없음
      Synced Healthy
    points:
      - ["세 층", "plan · Argo · curl"]
      - ["절반", "컨트롤 플레인"]
      - ["실무", "클러스터는 오래 산다"]
    notes: "오해: 스크립트가 있으면 IaC — 단계가 선언적이어야. 학술: 재해 복구는 돌려 봐야(SRE Workbook). 트렌드: README 몇 줄로 누구나 재현."

  - type: section
    num: "3교시"
    title: "커밋 하나, 클러스터 둘"
    goals: ["같은 저장소, 다른 폴더", "2.2.0이 두 곳에", "함께 바뀌는 위험", "오버레이로 승격"]
    notes: "배포 저장소 토큰 30일 만료 주의 — GitHub App으로."

  - type: image
    title: "PR 하나 → 두 클러스터"
    img: week5/day5/w5d5-two-clusters.png
    notes: "eks/가 ../devmart를 참조 — images: 변경이 함께. CI는 어느 클러스터도 모른다."

  - type: steps
    title: "실습 3 · 승격 — 개발 먼저, 운영은 PR로"
    steps:
      - ["고정", "eks/kustomization.yaml에 images: — 지금 태그"]
      - ["2.3.0", "PR 합치기 → 봇은 devmart/만 → kind 2.3.0 · eks 2.2.0"]
      - ["확인", "kind에서 대시보드 · 알림 (4주차 2일차)"]
      - ["승격", "eks의 태그 세 줄 PR → 합치기 → eks 2.3.0, 되돌리기는 revert"]
    notes: "같은 이미지를 다시 빌드하지 않는다. 오해: 환경마다 브랜치 — 한 브랜치 + 폴더. 학술: 카나리와 승격은 겹쳐 쓴다. 트렌드: Kargo · 자동 승격 PR."

  - type: section
    num: "4교시"
    title: "노드와 AZ 장애"
    goals: ["기준선", "db 노드 종료", "AZ 막기", "상태 있는 것의 자리"]
    notes: "db가 있는 노드와 AZ를 먼저 적는다. 손님 루프를 켜 둔다."

  - type: table
    title: "훈련 1 · db 노드를 종료했을 때"
    head: ["시각", "손님", "Kubernetes", "AWS"]
    rows:
      - ["+0:30", "orders 503", "노드 NotReady · Pod 삭제", "인스턴스 종료 중"]
      - ["+0:40", "products 200", "catalog · order는 2c로 · db Pending", ""]
      - ["+1:30", "orders 503", "", "노드 그룹이 2a에 새 인스턴스"]
      - ["+4:30", "orders 202", "db Running — 같은 EBS 다시 붙음", "볼륨 attach"]
    colw: [1.4, 2.6, 4.6, 3.6]
    notes: "주문 번호가 이어진다 — PVC 볼륨은 노드와 수명이 따로. 같은 AZ에 새 노드가 생긴 것은 운이 좋았던 부분."

  - type: image
    title: "훈련 2 · AZ를 막으면"
    img: week5/day5/w5d5-az.png
    notes: "cordon + drain 2a → db Pending: volume node affinity conflict, 2c가 비어 있어도. 기다려도 안 낫는다. Pod+EBS / 복제 DB / RDS Multi-AZ. 오해: 노드가 여러 AZ면 고가용성 — 가장 약한 고리. 학술: CAP(Gilbert & Lynch 2002). 트렌드: AWS FIS, AZ 장애 훈련."

  - type: section
    num: "5교시"
    title: "전부 지우기 · 비용 보고"
    goals: ["down.sh", "state 버킷 · OIDC까지", "모든 리전 확인", "Cost Explorer"]
    notes: "장부를 쓰는 프로젝트 먼저, 장부를 담은 버킷은 마지막. 버전 관리 버킷은 모든 버전을 지워야."

  - type: table
    title: "이번 주 비용 (예, 크레딧 차감 전)"
    head: ["서비스", "금액", "언제"]
    rows:
      - ["EKS", "$0.70", "목 · 금"]
      - ["EC2 — Compute", "$0.85", "화 · 목 · 금"]
      - ["EC2 — Other (NAT · EBS · 공인 IP)", "$0.80", "화 · 목 · 금"]
      - ["Elastic Load Balancing", "$0.30", "화 · 목 · 금"]
      - ["합계", "약 $2.7 (청구 $0)", ""]
    colw: [6.0, 3.0, 3.0]
    notes: "남은 것: devops-admin · 예산 둘(무료). 계정: 계속 공부 / 두기 / 닫기(90일). 오해: 계정을 닫으면 과금이 바로 끝 — 지우기 → 확인 → 닫기. 학술: 비용의 행동경제학 — 습관과 기본값. 트렌드: AI 워크로드 FinOps."

  - type: section
    num: "6교시"
    title: "5주 회고 + 포트폴리오"
    goals: ["다섯 주를 내 말로", "KPT", "저장소 셋의 지도", "비밀 점검"]
    notes: "도구가 아니라 '할 수 있게 된 일'로. Try는 30일 안에 한 번에 끝낼 수 있게."

  - type: compare
    title: "포트폴리오 — 무엇이 증거가 되나"
    left: ["약한 증거", ["도구 이름 나열", "화려한 앱 화면", "README 없는 저장소", "'Kubernetes 사용 경험'"]]
    right: ["강한 증거", ["up.sh · down.sh — 누구나 재현", "장애 보고서와 '다음에는'", "구조 그림과 '왜 이렇게'", "비용 숫자와 보안 점검"]]
    notes: "devops-lab(CI) · devmart-deploy(GitOps) · devmart-infra(IaC). 공개 전 키 검사 — 찾으면 폐기가 먼저. 학술: 성찰적 실천(Schön 1983). 트렌드: 무엇을 왜 결정했나를 설명하는 능력."

  # 7교시
  - type: section
    num: "7교시"
    title: "포트폴리오 발표 — 5분 데모와 질의응답"
    goals: ["5분의 순서", "증거 모으기", "데모 리허설 · 짝 피드백", "질문 열 개 — 어디서 해 봤나"]
    notes: "'할 줄 안다'가 아니라 '해 봤고, 이것이 증거다'. 오늘은 그것을 5분 안에 보여 주는 연습."

  - type: table
    title: "5분의 순서"
    head: ["순서", "시간", "꽂을 증거"]
    rows:
      - ["1 문제", "30초", "README 첫 줄"]
      - ["2 구조", "1분", "4주차 5일차의 한 장"]
      - ["3 데모", "1분 30초", "커밋 → CI(검문 · 서명) → 배포 저장소 → Argo CD"]
      - ["4 장애 하나", "1분", "장애 보고서 — 증상 · 원인 · 조치 · 다음에는"]
      - ["5 숫자와 배움", "1분", "비용 보고 · up.sh 시간"]
    colw: [2.6, 2.0, 7.5]
    callout: "도구 이름은 이야기 속에서만 — 문제 → 도구 순서로"
    callout_color: orange

  - type: code
    title: "실습 10~11 · 증거 모으기와 데모 각본"
    shell: "bash"
    code: |
      sed -i 's/APP_VERSION = .*/APP_VERSION = "2.3.0"/' devmart-msa/catalog-api/app.py
      git commit -am "catalog-api 2.3.0 (발표 데모)" && git push -u origin demo/version
      gh pr create --fill && gh pr merge --squash --delete-branch --auto
      gh run watch … --exit-status
      kubectl get pods -n devmart -l app=catalog-api -w
    points:
      - ["kind로 데모", "EKS는 5교시에 지웠다 — 같은 구조"]
      - ["데모도 PR로", "급할 때도 절차를 지킨다"]
      - ["실패하면", "\"이 실패는 이렇게 읽습니다\""]

  - type: table
    title: "짝 피드백 기준 (1~3점)"
    head: ["기준", "3점이면"]
    rows:
      - ["문제가 먼저", "첫 30초에 무엇을 해결했나"]
      - ["증거", "말마다 화면 · 링크 · 숫자"]
      - ["장애 이야기", "증상 → 원인 → 조치 → 다음에는"]
      - ["시간", "4분 30초 ~ 5분 30초"]
      - ["모르는 사람도", "도구가 하는 일을 함께 말했다"]
    colw: [3.5, 8.6]

  - type: cards
    title: "실습 12 · 질문 열 개 — 상황 · 행동 · 결과 · 배움"
    cards:
      - [Search, teal, "Pod가 안 뜨면?", "3주차 4일차 진단 순서"]
      - [RotateCcw, teal, "배포 중 장애가 나면?", "롤백 · git revert"]
      - [ShieldCheck, violet, "이미지는 어떻게 믿나?", "Trivy · 서명 · Kyverno"]
      - [FileText, violet, "가장 어려웠던 문제는?", "나의 장애 보고서"]

  - type: compare
    title: "학술 노트 · 트렌드"
    left: ["설명하면 이해가 깊어진다 (Chi 외, 1994)", ["스스로 설명하게 하면 이해가 깊어진다", "설명하려면 빈틈을 메워야", "막힌 칸 → 8교시 30일 계획"]]
    right: ["면접이 '해 보기'로", ["라이브 트러블슈팅 · 시스템 설계", "공개 저장소 · 장애 보고서를 함께 읽기", "AI의 답을 어떻게 검증했나"]]

  - type: quiz
    title: "7교시 확인 문제"
    questions:
      - "도구 이름부터 말하면 무엇이 아쉬운가?"
      - "라이브 데모가 실패하면?"
      - "경험 질문에 답하는 네 단계는?"
      - "답을 못 쓴 칸은?"
    answers: "1) 무엇을 해결했는지 안 들린다  2) 실패를 함께 읽는다  3) 상황 · 행동 · 결과 · 배움  4) 30일 계획에 넣는다"

  - type: section
    num: "8교시"
    title: "다음 걸음"
    goals: ["소개만 한 것", "자격증", "30일 계획", "마지막 배움일기(수업 뒤)"]
    notes: "다시 만들기 → 하나씩 PR → 글로 쓰기 → 자격증."

  - type: table
    title: "소개만 하고 지나간 것 — 다음 걸음"
    head: ["주제", "다음 걸음"]
    rows:
      - ["관리형 DB", "RDS 모듈 → db 이전 → AZ 훈련 다시"]
      - ["비밀 값 GitOps", "External Secrets + Secrets Manager (Pod Identity)"]
      - ["EKS 관찰 · 오토스케일링", "Managed Prometheus · OTel, HPA · KEDA · Karpenter"]
      - ["TLS · 도메인", "Route 53 + ACM + HTTPS 리스너, ExternalDNS"]
      - ["공급망 · 플랫폼", "cosign · SLSA · ImageValidatingPolicy, app of apps"]
      - ["자격증", "SAA · CKA · CKAD · CKS · Terraform Associate"]
    colw: [3.6, 8.4]
    notes: "학술: 의도적 연습(Ericsson 1993) — 분명한 목표 · 즉각 피드백 · 조금 어려운 연습. 트렌드: AI와 함께 — plan 읽기 · 원하는 상태 적기 · 누가 거절했나 · 비용과 책임의 판단은 사람의 것."

  - type: summary
    title: "5주 — 그리고 오늘"
    items:
      - ["1교시", "다섯 층의 지도 · 원하는 상태를 적으면 맞춘다"]
      - ["2교시", "up.sh — 명령 한 줄, 약 30분"]
      - ["3교시", "커밋 하나, 클러스터 둘 · 오버레이로 승격"]
      - ["4교시", "노드 종료는 회복, AZ 장애는 멈춤 — 상태의 자리"]
      - ["5교시", "남김없이 지우기 · 모든 리전 확인 · 비용 약 $2.7"]
      - ["6교시", "회고 · KPT · 포트폴리오 README"]
      - ["7교시", "5분 = 문제→구조→데모→장애 하나→숫자, 말마다 증거, 질문엔 상황·행동·결과·배움"]
      - ["8교시", "30일 계획 — 막힌 칸부터"]
    diary: "마지막 배움일기 — up.sh 시간 · 커밋 하나가 두 곳에 간 이유 셋 · 주문이 멈춘 이유 세 문장 · 이번 주 비용 · 가장 오래 막혔던 순간 · 다섯 주를 꿰는 한 문장 · 30일 계획의 첫 주"
    notes: "클라우드는 남의 컴퓨터 — 코드로 빌리고, 올리고, 지켜보고, 고치고, 지키고, 남김없이 돌려준다. 다음은 그것을 여러분의 것으로 다시 만드는 일."
