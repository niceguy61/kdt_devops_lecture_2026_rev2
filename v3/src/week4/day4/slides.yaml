meta:
  footer: "4주차 4일차 · Service Mesh"
  title: "4주차 4일차 — Service Mesh"

slides:
  - type: cover
    kicker: "CLOUD NATIVE DEVOPS · 4주차 Kubernetes 운영"
    title: "Service Mesh"
    subtitle: "4주차 4일차 · 남북과 동서 · sidecar와 ambient · Istio · mTLS · Kiali · waypoint · 장애 주입 · 호출 허가"
    notes: "어제 질문: 서비스 사이 호출은 아무 검사 없이 오갔다. 누가 누구를 부를 수 있나, 암호화되나? 오늘은 안에서 안으로 — 코드 한 줄 안 고치고."

  - type: agenda
    title: "오늘의 흐름"
    items:
      - ["1교시", "1", "3일차 요약 + 서비스 메시"]
      - ["2교시", "2", "Istio 설치와 메시 등록"]
      - ["3교시", "3", "mTLS 확인과 Kiali"]
      - ["4교시", "4", "waypoint와 트래픽 나누기"]
      - ["5교시", "5", "장애 주입 · 타임아웃 · 재시도"]
      - ["6교시", "6", "mTLS STRICT와 호출 허가"]
      - ["7교시", "7", "메시 운영 판단"]
      - ["8교시", "8", "메시 문제 해결"]
    notes: "0.6~1GB 더. DevMart 변경은 모두 배포 저장소 커밋 — kubectl로 넣으면 selfHeal과 엇갈린다."

  - type: section
    num: "1교시"
    title: "서비스 메시"
    goals: ["남북과 동서", "메시가 하는 일", "mTLS", "sidecar vs ambient"]
    notes: "web을 3으로 scale → 다시 1. selfHeal이 살아 있다."

  - type: image
    title: "남북과 동서"
    img: week4/day4/w4d4-ns-ew.png
    notes: "order-api 코드의 CATALOG_TIMEOUT · CATALOG_RETRIES — 앱마다 같은 규칙. 메시: 암호화와 신원 · 허가 · 트래픽 · 관찰을 코드 밖에서. 오해: 클러스터 안은 안전하다 — 제로 트러스트. 학술: NIST SP 800-207, BeyondCorp, SP 800-204A."

  - type: image
    title: "sidecar와 ambient"
    img: week4/day4/w4d4-sidecar-ambient.png
    notes: "ambient: ztunnel(L4) 노드마다, waypoint(L7) 필요한 곳에만, 라벨 하나 · 재시작 없음. 2024 GA(1.24). 트렌드: 2026 멀티클러스터 베타 · 멀티 네트워크 GA, 1.31(2026-08-31) agentgateway waypoint."

  - type: section
    num: "2교시"
    title: "Istio 설치와 메시 등록"
    goals: ["istioctl precheck", "네 차트", "라벨 커밋 하나", "재시작 없음"]
    notes: "Istio 1.31 지원 K8s는 1.32~1.36 — kind 1.37은 경고 가능. 메시가 클러스터 업그레이드 순서를 정한다."

  - type: code
    title: "실습 2~3 · 설치와 등록"
    code: |
      CH=oci://ghcr.io/istio/release/charts
      helm install istio-base $CH/base    -n istio-system --create-namespace --version $ISTIO
      helm install istiod     $CH/istiod  -n istio-system -f istio/istiod-values.yaml   # profile: ambient
      helm install istio-cni  $CH/cni     -n istio-system -f istio/cni-values.yaml
      helm install ztunnel    $CH/ztunnel -n istio-system -f istio/ztunnel-values.yaml
      # 배포 저장소: namespace.yaml에 istio.io/dataplane-mode: ambient → commit · push
      istioctl ztunnel-config workloads | grep devmart
    out: |2
      devmart  catalog-api-5d8c7b9f6-2xkq4  10.244.1.15  devmart-worker  None  HBONE
      devmart  db-6b7f8c9d5-q4w2e           10.244.1.12  devmart-worker  None  HBONE
      재시작 없음
    points:
      - ["순서", "CRD → 두뇌 → cni → 프록시"]
      - ["HBONE", "mTLS 터널"]
      - ["되돌리기", "라벨 커밋 revert"]
    notes: "1.31부터 구글 클라우드 저장소에서 옮김 — oci://ghcr.io/istio/release/charts. 학술: 데이터 평면 / 제어 평면, OpenFlow(2008). 트렌드: L4부터 켜고 L7은 나중에 — 단계적 도입."

  - type: section
    num: "3교시"
    title: "mTLS 확인과 Kiali"
    goals: ["SPIFFE 신원", "ztunnel 로그", "PERMISSIVE", "메시 지도"]
    notes: "신원 = 네임스페이스 + ServiceAccount. 지금 DevMart는 모두 sa/default — 내일 나눈다."

  - type: code
    title: "실습 4~5 · 신원과 메시 밖"
    code: |
      kubectl logs -n istio-system -l app=ztunnel | grep catalog-api | tail -1
      kubectl run plain -n default --image=curlimages/curl:8.17.0 -- sleep 3600
      kubectl exec -n default plain -- curl -s catalog-api.devmart:8000/api/info
    out: |2
      src.identity="spiffe://cluster.local/ns/devmart/sa/default"
      dst.identity="spiffe://cluster.local/ns/devmart/sa/default"  dst.addr=…:15008
      {"service":"catalog-api","version":"2.0.0"}      ← 아직 열린다 (PERMISSIVE)
    points:
      - ["상호", "양쪽 신원"]
      - ["15008", "HBONE 포트"]
      - ["PERMISSIVE", "평문도 받는다"]
    notes: "Istio 지표: ServiceMonitor istiod, PodMonitor ztunnel · waypoint. istio_tcp_connections_opened_total — ztunnel은 L4라 연결 · 바이트만. Kiali: view_only, 어제 Prometheus. 오해: 지도는 설계도다 — 실제 트래픽. 학술: Aguilera 2003 블랙박스. 트렌드: 워크로드 신원 — EKS Pod Identity."

  - type: section
    num: "4교시"
    title: "waypoint와 트래픽 나누기"
    goals: ["waypoint = Gateway", "메시 안의 손님", "Service가 부모인 HTTPRoute", "입구는 왜 안 나뉘나"]
    notes: "waypoint: gatewayClassName istio-waypoint, 네임스페이스 라벨 istio.io/use-waypoint."

  - type: code
    title: "실습 10 · 메시 안 호출의 90/10"
    shell: "devmart/catalog-split.yaml"
    code: |
      parentRefs:
        - group: ""
          kind: Service            # 부모가 Service — 동서 (GAMMA)
          name: catalog-api
      rules:
        - backendRefs:
            - { name: catalog-api-stable, port: 8000, weight: 90 }
            - { name: catalog-api-canary, port: 8000, weight: 10 }
    out: |2
      ./test/load.sh 100          (devmart의 client Pod에서)
           91 "version":"2.0.0"
            9 "version":"2.1.0-canary"
      입구 30080에서 20번:  20 "version":"2.0.0"
    points:
      - ["남북", "입구 HTTPRoute"]
      - ["동서", "Service HTTPRoute"]
      - ["입구", "Pod IP로 바로 — waypoint 안 거침"]
    notes: "카나리 태그는 images:가 정한다. 오해: 메시가 있으면 입구 Gateway는 필요 없다 — 책임이 다르다. 학술: SRE Workbook 16장 카나리 통계. 트렌드: Gateway API GAMMA를 Istio · Linkerd · Cilium이 같이 읽는다."

  - type: section
    num: "5교시"
    title: "장애 주입"
    goals: ["왜 일부러", "3초 지연", "50% 실패", "타임아웃 · 재시도"]
    notes: "실제로 더 고약한 것은 '완전히 죽음'이 아니라 '느려짐'과 '가끔 실패'. Gateway API에 장애 주입이 없어 VirtualService."

  - type: table
    title: "실습 12~15 · 커밋 하나씩 바꿔 가며"
    head: ["주입", "orders", "products", "본 곳"]
    rows:
      - ["delay 3s", "503 · 정확히 약 2초 (CATALOG_TIMEOUT)", "200 그대로", "Grafana 오류율 · 알림 Firing · waypoint 로그 DI"]
      - ["delay 1s", "202 · 1.04초", "200", "p95만 오른다 — 오류율 알림으론 못 잡는다"]
      - ["abort 50% 503", "반은 503 · 0.01초 (빠른 실패)", "200", "Kiali 빨간 선"]
      - ["timeout 1s + retries 2", "202 · 정상", "200", "평소의 회복 설정"]
    colw: [2.2, 3.8, 1.8, 4.4]
    notes: "재시도는 곱해진다 — 앱 2 × 메시 2 = 최악 9번. 한 층에서만, 안전한 요청(GET)만 — POST 재시도는 주문 중복. 학술: Chaos Engineering(Basiri 2016), Metastable Failures(Huang 2021, Bronson 2022). 트렌드: Chaos Mesh · LitmusChaos · AWS FIS."

  - type: section
    num: "6교시"
    title: "mTLS STRICT와 호출 허가"
    goals: ["인증과 허가", "STRICT의 사고", "입구도 메시에", "AuthorizationPolicy"]
    notes: "PeerAuthentication = 신분증을 보여 줬나, AuthorizationPolicy = 이 방에 들어와도 되나."

  - type: steps
    title: "실습 16~18 · 막고, 사고 나고, 고치고, 좁히기"
    steps:
      - ["STRICT", "plain(메시 밖) → 000, 그런데 사이트도 503!"]
      - ["원인", "Envoy Gateway도 메시 밖 — 평문으로 보냈다"]
      - ["고침", "envoy-gateway-system에 ambient 라벨 → 200 (platform-changes.md에 기록)"]
      - ["허가", "catalog-api는 devmart에서만 → outsider 403 RBAC: access denied, 주문 202"]
    notes: "STRICT 전에 '메시 밖에서 들어오는 것'을 먼저 센다. 허가는 IP가 아니라 SPIFFE 신원. 우회: Pod IP로 바로 → waypoint 안 거침 → L4 정책 · NetworkPolicy로 겹겹이. 학술: Saltzer & Schroeder 1975 최소 권한 · 완전한 중재. 트렌드: CVE-2026-39350, 정책 시험 도구."

  - type: image
    title: "ambient의 길 — 그리고 우회로"
    img: week4/day4/w4d4-ambient-flow.png
    notes: "앱은 평문으로 보내고 평문으로 받는다. ztunnel이 감싸고 풀고, waypoint가 L7을 본다. istiod가 신원 인증서를 발급."

  - type: section
    num: "7교시"
    title: "메시 운영 판단"
    goals: ["비용 재기", "필요한가", "다른 메시", "업그레이드 · 정리"]
    notes: "container_memory_working_set_bytes로 istio-system을 잰다."

  - type: compare
    title: "메시가 필요한가"
    left: ["메시 대신", ["서비스 몇 개 · 한 팀 → 앱 타임아웃 + 관찰", "암호화만 → ambient L4만", "입구만 → 1일차 Gateway", "차단만 → NetworkPolicy"]]
    right: ["메시가 맞다", ["서비스 많고 팀이 여럿", "규제: 서비스 사이 암호화 · 접근 기록", "언어가 섞여 앱마다 구현이 비싸다", "L4부터 켜고 L7은 필요한 곳에만"]]
    notes: "비용: 자원 · 지연 · 복잡도 · 업그레이드. 다른 메시: Linkerd(가볍다) · Cilium(eBPF). 업그레이드: revision으로 istiod 두 버전 → 네임스페이스 하나씩. 학술: ESB → 똑똑한 끝점 → 메시 → ambient, Morgan 2017. 트렌드: AI 트래픽, Inference Extension."

  # 8교시
  - type: section
    num: "8교시"
    title: "메시 문제 해결 — istioctl로 진단하기"
    goals: ["연습장 mesh-lab", "등록 누락 · 안 걸린 정책 · 신원 오타", "analyze · ztunnel-config · ztunnel 로그", "waypoint list · proxy-status"]
    notes: "메시는 코드 밖에서 가로챈다 — 앱 로그엔 없다. 메시에게 물어본다. devmart는 Argo CD가 지키므로 건드리지 않는다."

  - type: table
    title: "실습 22 · 장애 세 가지"
    head: ["장애", "증상", "찾는 도구"]
    rows:
      - ["A 등록 누락", "요청은 된다 — PROTOCOL TCP (평문)", "ztunnel-config workloads"]
      - ["B 셀렉터 오타", "낯선 Pod도 200 — 에러 없음", "istioctl analyze → IST0127"]
      - ["C 신원 오타", "client도 000 · analyze는 깨끗", "ztunnel 로그 policy rejection · src.identity"]
    colw: [2.6, 5.0, 4.5]
    callout: "analyze는 '없는 신원'까지는 모른다 — 3교시에 SPIFFE ID를 읽어 둔 이유"
    callout_color: orange

  - type: code
    title: "장애 B — 정책이 아무 데도 안 걸렸다"
    shell: "bash"
    code: |
      # selector: app: sever   ← 오타
      kubectl exec -n mesh-lab stranger -- curl -s -o /dev/null -w '%{http_code}' server:9898/
      istioctl analyze -n mesh-lab
    out: |2
      200
      Warning [IST0127] (AuthorizationPolicy mesh-lab/server-allow-client)
        No matching workloads for this resource with the following labels: app=sever
    points:
      - ["고친 뒤", "stranger 000(56) · client 200"]
      - ["ztunnel", "L4에서 신원을 보고 끊는다"]

  - type: table
    title: "진단 순서 — 한 장"
    head: ["증상", "먼저", "그다음"]
    rows:
      - ["메시가 안 하는 것 같다", "ztunnel-config workloads", "dataplane-mode 라벨"]
      - ["정책이 아무 변화 없음", "istioctl analyze", "selector · targetRefs"]
      - ["reset · 000 · 56", "ztunnel 로그 · src.identity", "principals"]
      - ["L7 규칙이 안 먹음", "waypoint list · proxy-status", "use-waypoint 라벨"]
      - ["메시 탓인지 모름", "연습장에서 라벨 빼고 재현", "운영은 Git 커밋으로"]
    colw: [3.4, 4.4, 4.3]

  - type: compare
    title: "학술 노트 · 트렌드"
    left: ["Beschastnikh 외 (CACM 2016)", ["동시성 · 부분 실패 · 관찰의 어려움", "도구 하나로는 부족하다", "스스로 상태를 말하게 — 겹쳐 쓴다"]]
    right: ["진단도 노드 단위로", ["사이드카: Pod마다 proxy-config", "ambient: ztunnel-config", "라벨 하나로 넣고 빼며 가른다"]]

  - type: quiz
    title: "8교시 확인 문제"
    questions:
      - "요청은 되는데 PROTOCOL이 TCP — 문제는?"
      - "ALLOW를 썼는데 낯선 Pod가 들어온다 — 먼저 칠 명령은?"
      - "analyze가 깨끗한데 client가 끊긴다 — 다음은?"
      - "운영에서 라벨을 뺄 때 Git 커밋으로 하는 이유는?"
    answers: "1) 메시 등록 누락(평문)  2) istioctl analyze  3) ztunnel 로그의 src.identity  4) selfHeal이 되돌리고, 기록이 남아야 하므로"

  - type: summary
    title: "오늘 만든 것"
    items:
      - ["1교시", "남북은 입구, 동서는 메시 · sidecar vs ambient"]
      - ["2교시", "Istio ambient 네 차트 · 라벨 커밋 하나로 등록, 재시작 없음"]
      - ["3교시", "SPIFFE 신원 · ztunnel 로그 · Istio 지표 · Kiali 지도"]
      - ["4교시", "waypoint · Service가 부모인 HTTPRoute로 90/10"]
      - ["5교시", "3초 지연 · 50% 실패 · 타임아웃 · 재시도는 곱해진다"]
      - ["6~7교시", "STRICT의 사고와 해결 · 신원으로 허가 · 메시 비용과 판단"]
      - ["8교시", "메시에게 물어본다 — ztunnel-config(누가 안인가) · analyze(말 안 되는 설정) · ztunnel 로그(누가 거절됐나) · proxy-status"]
    diary: "배움일기 — 남북 · 동서 · 내가 본 SPIFFE ID · products와 orders가 다르게 반응한 이유 · STRICT 전에 셌어야 할 것 · 메시 비용과 내 판단 · 같은 신원(sa/default)을 어떻게 나누나?"
    notes: "client · plain · outsider는 지운다. Istio · 정책은 남긴다. 5분 복구: Istio를 Argo CD Application보다 먼저. 내일: 보안 — RBAC · ServiceAccount · Kyverno."
