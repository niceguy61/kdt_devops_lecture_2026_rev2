# 4교시 · 메시 안에서 catalog-api로 가는 호출의 10%를 카나리로
# parentRefs가 Gateway가 아니라 Service — Gateway API의 '메시용' 쓰임새 (GAMMA)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-split
  namespace: devmart
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: catalog-api
      port: 8000
  rules:
    - backendRefs:
        - name: catalog-api-stable
          port: 8000
          weight: 90
        - name: catalog-api-canary
          port: 8000
          weight: 10
