# 5교시 · 모든 컨테이너에 메모리 limits — 처음엔 Audit(보고만), 확인 뒤 Deny로
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-memory-limits
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [devmart] }
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  matchConditions:
    - name: not-istio-managed
      expression: "!has(object.metadata.labels) || !('gateway.istio.io/managed' in object.metadata.labels)"
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory))
      message: "모든 컨테이너에 resources.limits.memory가 있어야 합니다 (3주차 5일차)."
