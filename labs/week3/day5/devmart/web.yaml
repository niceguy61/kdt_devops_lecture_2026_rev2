# nginx — 정적 파일 + API 게이트웨이. 브라우저는 localhost:30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: devmart
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: html
          configMap: { name: web-html }
        - name: conf
          configMap: { name: web-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: devmart
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
