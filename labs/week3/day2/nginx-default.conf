# 접근 로그에 요청 ID와 걸린 시간도 남긴다 (3주차 2일차)
log_format devmart '$remote_addr [$time_local] "$request" $status '
                   'rid=$request_id upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log devmart;
    root /usr/share/nginx/html;
    index index.html;

    # 요청마다 고유 번호를 붙여 뒤쪽 서비스들에 넘긴다 (분산 추적의 출발점)
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # 주소에 따라 다른 서비스로 보낸다 (API 게이트웨이 역할)
    location /api/orders {
        proxy_pass http://order-api:8000;
    }

    location /api/ {
        proxy_pass http://catalog-api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
